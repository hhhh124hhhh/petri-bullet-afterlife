<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>培养皿：弹幕余生 — Prototype 1（战斗爽感验证）</title>
<style>
  /* 页面深色背景，Canvas 居中铺满视口 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07121D;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    /* 让 canvas 保持 9:16 比例并尽可能铺满视口 */
    aspect-ratio: 9 / 16;
    height: 100vh;
    max-width: 100vw;
    image-rendering: auto;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<script>
(function () {
  'use strict';

  // ===== 逻辑分辨率（竖屏 9:16）=====
  const LOGICAL_W = 360;
  const LOGICAL_H = 640;

  // ===== 色板 =====
  const COLOR_BG = '#07121D';      // 背景深蓝黑
  const COLOR_PLAYER = '#38E8E0'; // 玩家青
  const COLOR_ENEMY = '#FF7138';   // 感染橙
  const COLOR_OUTLINE = '#241638';// 描边深紫
  const COLOR_WHITE = '#F3F7FA';   // 系统白

  // ===== 玩法参数 =====
  const PLAYER_SPEED = 150;   // 玩家移速 px/s（跟手性优先于纸面数值）
  const ENEMY_SPEED = 110;    // 敌人移速 px/s
  const ENEMY_COUNT = 20;     // 敌人数量
  const ENEMY_SIZE = 16;      // 敌人逻辑尺寸
  const ENEMY_SEPARATION = 26;// 敌人分离强度系数
  const INVOKED_IFRAME = 0.45; // 无敌帧时长（秒）
  const ENEMY_R = ENEMY_SIZE / 2; // 敌人逻辑半径（碰撞用）
  const PLAYER_R = 12; // 主角逻辑半径（size 24 / 2；怪不许叠进人的推开距离用）

  // ===== 战斗参数（Prototype 1）=====
  const ENEMY_MAX_HP = 50;   // 敌人血量上限
  const RESPAWN_TIME = 1.0;  // 死亡后重生延迟（秒）
  const FLASH_TIME = 0.08;   // 受击白闪时长（秒）
  const HIT_STOP = 0.04;     // 死亡微顿（秒）：逻辑时间冻结，画面照常绘制

  // 脉冲针（自动单体）
  const NEEDLE_CD = 0.55;      // 发射间隔（秒）
  const NEEDLE_RETRY = 0.1;    // 无目标时的重试间隔（秒）
  const NEEDLE_RANGE = 260;    // 索敌范围
  const NEEDLE_SPEED = 420;    // 弹速 px/s
  const NEEDLE_DMG = 12;       // 伤害
  const NEEDLE_POOL = 32;      // 对象池容量
  const NEEDLE_R = 4;          // 弹体逻辑半径
  const NEEDLE_MARGIN = 40;    // 出屏回收余量
  const NEEDLE_FUSE = 2.5;     // 保险丝：兜底回收，避免漏网弹体永久占用池位

  // 离心刃（环绕近战）
  const BLADE_COUNT = 2;       // 刀刃数量
  const BLADE_RADIUS = 46;     // 环绕半径
  const BLADE_OMEGA = 3.6;     // 角速度 rad/s
  const BLADE_DMG = 8;         // 伤害
  const BLADE_CD = 0.45;       // 单只敌人的受击间隔（秒）
  const BLADE_R = 7;           // 刀刃逻辑半径（碰撞用）

  // 培养电弧（弹射）
  const ARC_CD = 1.0;          // 触发间隔（秒）
  const ARC_RETRY = 0.1;       // 无目标时的重试间隔（秒）
  const ARC_RANGE = 260;       // 首发索敌范围
  const ARC_CHAIN_RANGE = 120; // 弹射索敌范围
  const ARC_JUMPS = 2;         // 弹射次数
  const ARC_DMG = 10;          // 首发伤害
  const ARC_FALLOFF = 0.8;     // 每次弹射伤害衰减（-20%）
  const ARC_LIFE = 0.12;       // 电弧存在时间（秒）
  const ARC_POOL = 4;          // 并发电弧上限
  const ARC_SEGMENTS = 3;      // 最大折线段数（玩家 → 命中1 → 命中2 → 命中3）
  const ARC_JITTER = 0.34;     // midpoint 抖动幅度系数

  // 粒子系统
  const PARTICLE_POOL = 200;   // 粒子对象池容量（固定，不扩容）

  // ===== 摇杆参数（视觉与响应统一半径，避免"手在动、杆不动"的脱节感）=====
  const STICK_RADIUS = 50; // 手指拖到 50px 即满速

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 自适应缩放：把逻辑坐标映射到实际画布尺寸 =====
  let scale = 1;
  let dpr = 1;
  let offX = 0, offY = 0; // contain 居中偏移（模块级，供背景烘焙使用）

  function resize() {
    // DPR 上限 2：移动端 fill-rate 优先，2x 对本作像素风已足够锐利
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.max(1, Math.round(rect.width));
    const cssH = Math.max(1, Math.round(rect.height));

    // 后备缓冲按 devicePixelRatio 放大
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);

    // 逻辑 360x640 等比缩放铺满画布（contain），居中
    scale = Math.min(canvas.width / LOGICAL_W, canvas.height / LOGICAL_H);
    offX = (canvas.width - LOGICAL_W * scale) / 2;
    offY = (canvas.height - LOGICAL_H * scale) / 2;

    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.imageSmoothingEnabled = true;

    renderBackground(); // 尺寸变化时重烘背景
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    // 延迟一帧，等待布局稳定后再计算
    setTimeout(resize, 100);
  });

  // ===== 玩家状态 =====
  const player = {
    x: LOGICAL_W / 2,
    y: LOGICAL_H - 140,
    size: 24,
    invuln: 0,     // 剩余无敌时间
    animTime: 0,   // 浮动动画计时
    hp: 100, maxHp: 100, // 生命（P1：怪有接触伤害了，主角得有血条）
    hurtFlash: 0,  // 受击红闪计时
    deadT: 0       // 死亡复活倒计时（P1 极简：1.2s 后原地满血复活，不做结算）
  };
  const ENEMY_TOUCH_DMG = 8; // 怪接触伤害

  // ===== 敌人集合 =====
  // 场上恒定 20 只：数组只在初始化时 push 一次，之后死亡/重生只改字段，不增删
  const enemies = [];

  // 屏幕四周外圈定位（首次出生与死亡重生共用），复用同一个 scratch 对象避免每帧 new
  const edgeScratch = { x: 0, y: 0 };
  function edgePoint(i) {
    // 沿屏幕四周外圈生成，避免一开始就压在玩家身上
    const side = i % 4;
    if (side === 0) { edgeScratch.x = -20; edgeScratch.y = Math.random() * LOGICAL_H; }
    else if (side === 1) { edgeScratch.x = LOGICAL_W + 20; edgeScratch.y = Math.random() * LOGICAL_H; }
    else if (side === 2) { edgeScratch.x = Math.random() * LOGICAL_W; edgeScratch.y = -20; }
    else { edgeScratch.x = Math.random() * LOGICAL_W; edgeScratch.y = LOGICAL_H + 20; }
    return edgeScratch;
  }

  function spawnEnemy(i) {
    const p = edgePoint(i);
    enemies.push({
      x: p.x,
      y: p.y,
      vx: 0,
      vy: 0,
      // 包围角度均分（+微小抖动），避免纯随机导致的角度扎堆
      seed: (i / ENEMY_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.25,
      wobble: 0.6 + Math.random() * 0.8, // 每只细胞的蠕动相位频率
      orbitR: 30 + Math.random() * 16,   // 包围半径：瞄准玩家周围而非玩家中心，避免堆叠成一团
      sprite: ENEMY_SPRITES[i % ENEMY_SPRITES.length],         // 预渲染精灵
      spriteWhite: ENEMY_WHITE_SPRITES[i % ENEMY_WHITE_SPRITES.length], // 受击白闪用的纯白版
      hp: ENEMY_MAX_HP,
      maxHp: ENEMY_MAX_HP,
      alive: true,
      respawnT: 0,
      flash: 0,
      bladeCd: 0,
      sx: 0, sy: 0 // 分离推力缓存（两阶段计算用）
    });
  }

  // 死亡后原地重生：回到屏幕边缘，血量回满
  function respawnEnemy(e, i) {
    const p = edgePoint(i);
    e.x = p.x;
    e.y = p.y;
    e.vx = 0;
    e.vy = 0;
    e.hp = e.maxHp;
    e.alive = true;
    e.respawnT = 0;
    e.flash = 0;
    e.bladeCd = 0;
    e.sx = 0;
    e.sy = 0;
  }

  // 敌人精灵烘焙（2x 超采样：96px 画布对应 48 逻辑像素），3 种形态轮换
  function makeEnemySprite(seed) {
    const S = 96;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const cx = S / 2, cy = S / 2;
    const r = (ENEMY_SIZE / 2) * 2; // 逻辑半径 8 → 精灵内 16
    function blob(x, y, rr, sd, inflate) {
      const lobes = 7;
      g.beginPath();
      for (let i = 0; i <= lobes; i++) {
        const a = (i / lobes) * Math.PI * 2;
        const w = 1 + Math.sin(a * 3 + sd) * 0.12 + Math.cos(a * 2 - sd) * 0.07;
        const q = rr * w + inflate;
        const px = x + Math.cos(a) * q;
        const py = y + Math.sin(a) * q;
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath();
    }
    // 深紫描边底
    g.fillStyle = COLOR_OUTLINE;
    blob(cx, cy, r + 4.4, seed, 2); g.fill();
    // 橙色主体
    g.fillStyle = COLOR_ENEMY;
    blob(cx, cy, r, seed, 0); g.fill();
    // 内部暗核 + 高光
    g.fillStyle = COLOR_OUTLINE; g.globalAlpha = 0.55;
    g.beginPath(); g.arc(cx - r * 0.18, cy + r * 0.2, r * 0.3, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.5; g.fillStyle = COLOR_WHITE;
    g.beginPath(); g.arc(cx - r * 0.34, cy - r * 0.36, r * 0.22, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    return c;
  }
  const ENEMY_SPRITES = [makeEnemySprite(0.7), makeEnemySprite(2.83), makeEnemySprite(4.96)];

  // 受击白闪：把精灵拷到离屏画布，用 source-in 只保留形状填成纯白
  function makeWhiteVersion(src) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  const ENEMY_WHITE_SPRITES = [
    makeWhiteVersion(ENEMY_SPRITES[0]),
    makeWhiteVersion(ENEMY_SPRITES[1]),
    makeWhiteVersion(ENEMY_SPRITES[2])
  ];

  for (let i = 0; i < ENEMY_COUNT; i++) spawnEnemy(i);

  // ============================================================
  // 战斗系统（Prototype 1）
  // 三件自动武器 + 粒子 + 死亡反馈。弹体/粒子/电弧全部对象池，
  // 点位与锯齿折线都在释放那一刻算好，稳态下每帧零分配。
  // ============================================================

  // —— 粒子点精灵（白 / 青 / 橙；32px 画布对应 16 逻辑像素，2x）——
  function makeDotSprite(color) {
    const S = 32, R = 16;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(R, R, 0, R, R, R);
    grad.addColorStop(0, COLOR_WHITE);
    grad.addColorStop(0.3, color);
    grad.addColorStop(0.62, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, S, S);
    return c;
  }
  const PARTICLE_SPRITES = [makeDotSprite(COLOR_WHITE), makeDotSprite(COLOR_PLAYER), makeDotSprite(COLOR_ENEMY)];
  const P_WHITE = 0, P_CYAN = 1, P_ORANGE = 2;

  // —— 粒子对象池（固定 200，life <= 0 视为空槽）——
  const particles = [];
  for (let i = 0; i < PARTICLE_POOL; i++) {
    particles.push({
      x: 0, y: 0, vx: 0, vy: 0,
      life: 0, maxLife: 1,
      size: 1,
      sprite: PARTICLE_SPRITES[P_WHITE]
    });
  }

  function spawnParticle(x, y, vx, vy, life, size, sprite) {
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) {           // 命中火花/爆裂高频触发，优先吃刚空出来的槽
        p.x = x; p.y = y;
        p.vx = vx; p.vy = vy;
        p.life = life; p.maxLife = life;
        p.size = size;
        p.sprite = sprite;
        return true;
      }
    }
    return false;                 // 池满直接丢弃，绝不扩容
  }

  function updateParticles(dt) {
    const drag = Math.min(1, 6 * dt); // 线性减速
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      p.life -= dt;
      if (p.life <= 0) { p.life = 0; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx -= p.vx * drag;
      p.vy -= p.vy * drag;
    }
  }

  function drawParticles() {
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      const k = p.life / p.maxLife;
      const s = p.size * (0.35 + 0.65 * k); // 尾部收缩，配合 alpha 淡出
      ctx.globalAlpha = k;
      ctx.drawImage(p.sprite, p.x - s, p.y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
  }

  // 命中火花：4 粒，青白混合
  function spawnSparks(x, y) {
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 100; // 40~140 px/s
      spawnParticle(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        0.2 + Math.random() * 0.15,       // 0.2~0.35s
        2 + Math.random() * 2,
        i % 2 === 0 ? PARTICLE_SPRITES[P_WHITE] : PARTICLE_SPRITES[P_CYAN]
      );
    }
  }

  // 死亡爆裂：24 粒，橙白混合径向飞散（P1 反馈加强版：量大、初速高）
  const BURST_COUNT = 24;
  function spawnDeathBurst(x, y) {
    const base = Math.random() * Math.PI * 2;
    for (let i = 0; i < BURST_COUNT; i++) {
      const a = base + (i / BURST_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const sp = 80 + Math.random() * 180; // 80~260 px/s
      spawnParticle(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        0.35 + Math.random() * 0.25,       // 0.35~0.6s
        4 + Math.random() * 4,
        i % 3 === 0 ? PARTICLE_SPRITES[P_WHITE] : PARTICLE_SPRITES[P_ORANGE]
      );
    }
  }

  // —— 伤害结算：白闪 + 死亡反馈（death 触发爆裂、微顿、震屏）——
  let hitStop = 0; // 剩余微顿时间（秒），由 frame() 消费
  let shake = 0;   // 屏幕震动强度（px），frame() 里按真实时间衰减

  // —— 伤害数字对象池（24 个，命中即刷，不扩容）——
  const DMG_NUM_POOL = 24;
  const dmgNums = [];
  for (let i = 0; i < DMG_NUM_POOL; i++) {
    dmgNums.push({ life: 0, maxLife: 0.6, x: 0, y: 0, value: 0 });
  }
  let dmgNumCursor = 0;
  function spawnDmgNum(x, y, value) {
    const d = dmgNums[dmgNumCursor];
    dmgNumCursor = (dmgNumCursor + 1) % DMG_NUM_POOL;
    d.x = x + (Math.random() - 0.5) * 10;
    d.y = y - 8;
    d.value = Math.round(value);
    d.life = d.maxLife;
  }
  function updateDmgNums(dt) {
    for (let i = 0; i < DMG_NUM_POOL; i++) {
      const d = dmgNums[i];
      if (d.life <= 0) continue;
      d.life -= dt;
      d.y -= 38 * dt; // 上浮
    }
  }
  function drawDmgNums() {
    ctx.save();
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < DMG_NUM_POOL; i++) {
      const d = dmgNums[i];
      if (d.life <= 0) continue;
      const k = d.life / d.maxLife;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.fillStyle = '#ffd75e';
      ctx.fillText(d.value, d.x, d.y);
    }
    ctx.restore();
  }

  function hitEnemy(e, dmg) {
    if (!e.alive) return;
    e.hp -= dmg;
    e.flash = FLASH_TIME;
    spawnDmgNum(e.x, e.y, dmg);
    if (e.hp <= 0) {
      e.alive = false;
      e.hp = 0;
      e.respawnT = RESPAWN_TIME;
      spawnDeathBurst(e.x, e.y);
      // 40ms 微顿：连续死亡不断刷新为 0.04s，手感上就是"一串黏住的顿"
      hitStop = HIT_STOP;
      // 死亡震屏：叠加但封顶 7px，连杀不糊
      shake = Math.min(shake + 2.5, 7);
    }
  }

  // 最近的存活敌人；exclude 为已命中列表（电弧弹射去重）
  function nearestEnemy(x, y, range, exclude, excludeCount) {
    let best = null;
    let bestD = range * range;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      if (exclude) {
        let skip = false;
        for (let j = 0; j < excludeCount; j++) {
          if (exclude[j] === e) { skip = true; break; }
        }
        if (skip) continue;
      }
      const dx = e.x - x, dy = e.y - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  }

  // ===== 脉冲针（自动单体）=====
  // 40x12px 画布对应 20x6 逻辑像素，朝 +X；绘制时按速度方向旋转
  function makeNeedleSprite() {
    const W = 40, H = 12;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.lineJoin = 'round'; g.lineCap = 'round';
    // 深紫描边底
    g.strokeStyle = COLOR_OUTLINE;
    g.lineWidth = 4.2;
    g.beginPath();
    g.moveTo(4, H / 2);
    g.lineTo(W - 4, H / 2);
    g.stroke();
    // 青色针身：尾淡 → 尖锐白头
    const grad = g.createLinearGradient(2, 0, W - 2, 0);
    grad.addColorStop(0, 'rgba(56,232,224,0.25)');
    grad.addColorStop(0.45, COLOR_PLAYER);
    grad.addColorStop(1, COLOR_WHITE);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(2, H / 2 - 2.4);
    g.lineTo(W - 2.5, H / 2);
    g.lineTo(2, H / 2 + 2.4);
    g.closePath();
    g.fill();
    return c;
  }
  const needleSprite = makeNeedleSprite();
  const NEEDLE_L = 20, NEEDLE_HGT = 6;

  const needles = [];
  for (let i = 0; i < NEEDLE_POOL; i++) {
    needles.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, life: 0 });
  }
  let needleCursor = 0;
  let needleCd = NEEDLE_CD;

  function fireNeedle(target) {
    let slot = null;
    let idx = 0;
    for (let i = 0; i < NEEDLE_POOL; i++) {
      const c = needles[(needleCursor + i) % NEEDLE_POOL];
      if (!c.active) { slot = c; idx = (needleCursor + i) % NEEDLE_POOL; break; }
    }
    if (!slot) return; // 池满（本不该发生）直接放弃这次发射
    needleCursor = (idx + 1) % NEEDLE_POOL;

    const a = Math.atan2(target.y - player.y, target.x - player.x);
    slot.active = true;
    slot.x = player.x + Math.cos(a) * 12; // 从体表射出，避免贴脸立刻命中
    slot.y = player.y + Math.sin(a) * 12;
    slot.vx = Math.cos(a) * NEEDLE_SPEED;
    slot.vy = Math.sin(a) * NEEDLE_SPEED;
    slot.rot = a;
    slot.life = NEEDLE_FUSE;
  }

  const NEEDLE_HIT_R = ENEMY_R + NEEDLE_R;
  const NEEDLE_HIT_R2 = NEEDLE_HIT_R * NEEDLE_HIT_R;

  function updateNeedles(dt) {
    needleCd -= dt;
    if (needleCd <= 0) {
      const target = nearestEnemy(player.x, player.y, NEEDLE_RANGE, null, 0);
      if (target) { fireNeedle(target); needleCd = NEEDLE_CD; }
      else needleCd = NEEDLE_RETRY; // 无目标：0.1s 后重试
    }

    for (let i = 0; i < NEEDLE_POOL; i++) {
      const p = needles[i];
      if (!p.active) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot = Math.atan2(p.vy, p.vx);
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }

      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (!e.alive) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        if (dx * dx + dy * dy <= NEEDLE_HIT_R2) {
          hitEnemy(e, NEEDLE_DMG);
          spawnSparks(p.x, p.y);
          p.active = false; // 命中即回收
          break;
        }
      }
      if (!p.active) continue;
      // 出屏 40px 回收
      if (p.x < -NEEDLE_MARGIN || p.x > LOGICAL_W + NEEDLE_MARGIN ||
          p.y < -NEEDLE_MARGIN || p.y > LOGICAL_H + NEEDLE_MARGIN) {
        p.active = false;
      }
    }
  }

  function drawNeedles() {
    for (let i = 0; i < NEEDLE_POOL; i++) {
      const p = needles[i];
      if (!p.active) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(needleSprite, -NEEDLE_L / 2, -NEEDLE_HGT / 2, NEEDLE_L, NEEDLE_HGT);
      ctx.restore();
    }
  }

  // ===== 离心刃（环绕近战）=====
  // 32x16px 画布对应 16x8 逻辑像素，新月薄刃，朝 +X
  function makeBladeSprite() {
    const W = 32, H = 16;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(2, 8);
    g.quadraticCurveTo(16, 1.8, 30, 6);   // 刃背
    g.quadraticCurveTo(16, 10.2, 2, 8);  // 刃腹（两点相交成细月牙）
    g.closePath();
    g.strokeStyle = COLOR_OUTLINE;
    g.lineWidth = 3.2;
    g.stroke();
    g.fillStyle = COLOR_PLAYER;
    g.fill();
    // 刃口高光
    g.strokeStyle = COLOR_WHITE;
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(4.5, 7.2);
    g.quadraticCurveTo(16, 3.6, 28.5, 6.3);
    g.stroke();
    return c;
  }
  const bladeSprite = makeBladeSprite();
  const BLADE_L = 16, BLADE_HGT = 8;

  let bladeAngle = 0;
  const bladeX = new Float32Array(BLADE_COUNT);
  const bladeY = new Float32Array(BLADE_COUNT);
  const bladeRot = new Float32Array(BLADE_COUNT);
  const BLADE_HIT_R = ENEMY_R + BLADE_R;
  const BLADE_HIT_R2 = BLADE_HIT_R * BLADE_HIT_R;

  function updateBlades(dt) {
    bladeAngle += BLADE_OMEGA * dt;
    if (bladeAngle >= Math.PI * 2) bladeAngle -= Math.PI * 2;
    for (let b = 0; b < BLADE_COUNT; b++) {
      const a = bladeAngle + b * Math.PI; // 两枚相隔 π
      bladeRot[b] = a;
      bladeX[b] = player.x + Math.cos(a) * BLADE_RADIUS;
      bladeY[b] = player.y + Math.sin(a) * BLADE_RADIUS;
    }
    // 近战命中：每只敌人独立 bladeCd，保证单次掠过只掉一次血
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || e.bladeCd > 0) continue;
      for (let b = 0; b < BLADE_COUNT; b++) {
        const dx = e.x - bladeX[b], dy = e.y - bladeY[b];
        if (dx * dx + dy * dy <= BLADE_HIT_R2) {
          e.bladeCd = BLADE_CD;
          hitEnemy(e, BLADE_DMG);
          spawnSparks(e.x, e.y);
          break;
        }
      }
    }
  }

  function drawBlades() {
    for (let b = 0; b < BLADE_COUNT; b++) {
      ctx.save();
      ctx.translate(bladeX[b], bladeY[b]);
      // 刃口沿切线方向：视觉上像被甩起来的离心刀
      ctx.rotate(bladeRot[b] + Math.PI / 2);
      ctx.drawImage(bladeSprite, -BLADE_L / 2, -BLADE_HGT / 2, BLADE_L, BLADE_HGT);
      ctx.restore();
    }
  }

  // ===== 培养电弧（弹射）=====
  const ARC_MAX_POINTS = 1 + ARC_SEGMENTS * 2; // 玩家 + 3 段 × (抖动点 + 终点)
  const arcs = [];
  for (let i = 0; i < ARC_POOL; i++) {
    arcs.push({
      life: 0,
      count: 0,
      px: new Float32Array(ARC_MAX_POINTS),
      py: new Float32Array(ARC_MAX_POINTS)
    });
  }
  let arcCursor = 0;
  let arcCd = ARC_CD;
  const arcHit = [null, null, null, null];               // 本次已命中（去重）
  const arcNodeX = new Float32Array(ARC_SEGMENTS + 1);   // 折线节点（释放时算好）
  const arcNodeY = new Float32Array(ARC_SEGMENTS + 1);

  function fireArc(first) {
    const a = arcs[arcCursor];
    arcCursor = (arcCursor + 1) % ARC_POOL;

    let hitCount = 0;
    arcHit[hitCount++] = first;
    let nodeCount = 0;
    arcNodeX[0] = player.x; arcNodeY[0] = player.y; nodeCount = 1;

    let dmg = ARC_DMG;
    let fromX = first.x, fromY = first.y;
    arcNodeX[nodeCount] = fromX; arcNodeY[nodeCount] = fromY; nodeCount++;
    hitEnemy(first, dmg);
    dmg *= ARC_FALLOFF;
    spawnSparks(fromX, fromY);

    // 弹射 2 次：每次从上一个命中点找 120 内最近的未命中敌人
    for (let j = 0; j < ARC_JUMPS; j++) {
      const next = nearestEnemy(fromX, fromY, ARC_CHAIN_RANGE, arcHit, hitCount);
      if (!next) break;
      arcHit[hitCount++] = next;
      const nx = next.x, ny = next.y;
      hitEnemy(next, dmg);
      dmg *= ARC_FALLOFF;
      spawnSparks(nx, ny);
      fromX = nx; fromY = ny;
      arcNodeX[nodeCount] = nx; arcNodeY[nodeCount] = ny; nodeCount++;
    }

    // 锯齿折线：每段 midpoint 抖动，位置一次性算好，之后每帧只递减 life
    a.px[0] = arcNodeX[0]; a.py[0] = arcNodeY[0];
    let p = 1;
    for (let s = 0; s + 1 < nodeCount; s++) {
      const x0 = arcNodeX[s], y0 = arcNodeY[s];
      const x1 = arcNodeX[s + 1], y1 = arcNodeY[s + 1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.hypot(dx, dy) || 1;
      const j = (Math.random() - 0.5) * len * ARC_JITTER;
      a.px[p] = (x0 + x1) * 0.5 + (-dy / len) * j;
      a.py[p] = (y0 + y1) * 0.5 + (dx / len) * j;
      p++;
      a.px[p] = x1; a.py[p] = y1;
      p++;
    }
    a.count = p;
    a.life = ARC_LIFE;
  }

  function updateArcs(dt) {
    arcCd -= dt;
    if (arcCd <= 0) {
      const target = nearestEnemy(player.x, player.y, ARC_RANGE, null, 0);
      if (target) { fireArc(target); arcCd = ARC_CD; }
      else arcCd = ARC_RETRY;
    }
    for (let i = 0; i < ARC_POOL; i++) {
      const arc = arcs[i];
      if (arc.life > 0) arc.life -= dt;
    }
  }

  function strokeArcPath(a) {
    ctx.beginPath();
    ctx.moveTo(a.px[0], a.py[0]);
    for (let i = 1; i < a.count; i++) ctx.lineTo(a.px[i], a.py[i]);
    ctx.stroke();
  }

  function drawArcs() {
    for (let i = 0; i < ARC_POOL; i++) {
      const a = arcs[i];
      if (a.life <= 0) continue;
      const k = a.life / ARC_LIFE; // 1 → 0
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      // 宽的低透明青色光晕
      ctx.globalAlpha = 0.3 * k;
      ctx.strokeStyle = COLOR_PLAYER;
      ctx.lineWidth = 7;
      strokeArcPath(a);
      // 细的高亮白线
      ctx.globalAlpha = Math.min(1, 1.1 * k);
      ctx.strokeStyle = COLOR_WHITE;
      ctx.lineWidth = 2;
      strokeArcPath(a);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ===== 摇杆状态 =====
  const stick = {
    active: false,
    pointerId: null,   // 只处理单点触控
    originX: 0,         // 按下点（摇杆中心）
    originY: 0,
    knobX: 0,           // 当前摇杆头位置
    knobY: 0,
    x: 0,               // 归一化方向 -1~1
    y: 0,
    returnT: 1          // 松手回中插值
  };

  // 把屏幕坐标转换为逻辑坐标
  function toLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const px = (clientX - rect.left) * (canvas.width / rect.width);
    const py = (clientY - rect.top) * (canvas.height / rect.height);
    return {
      x: (px - (canvas.width - LOGICAL_W * scale) / 2) / scale,
      y: (py - (canvas.height - LOGICAL_H * scale) / 2) / scale
    };
  }

  function stickDown(p) {
    // 已有激活指针则忽略（单点触控）
    if (stick.active) return;
    stick.active = true;
    stick.pointerId = p.id;
    stick.originX = p.x;
    stick.originY = p.y;
    stick.knobX = p.x;
    stick.knobY = p.y;
    stick.x = 0;
    stick.y = 0;
    stick.returnT = 0;
  }

  function stickMove(p) {
    if (!stick.active || p.id !== stick.pointerId) return;
    let dx = p.x - stick.originX;
    let dy = p.y - stick.originY;
    const len = Math.hypot(dx, dy);

    // 摇杆头 1:1 跟手（钳制在统一半径内）；力度按同一半径归一化
    const k = len > STICK_RADIUS ? STICK_RADIUS / len : 1;
    stick.knobX = stick.originX + dx * k;
    stick.knobY = stick.originY + dy * k;

    // 死区处理
    const DEAD = 4;
    if (len > DEAD) {
      const nx = dx / len;
      const ny = dy / len;
      // 响应曲线：小幅度推动也给足速度。soak 实测慢速小拖只走一点点是"不丝滑"主因，
      // 把指数从 0.7 降到 0.45，前段更陡：推 10px 即半速，推 20px 约 2/3 速
      const t = Math.min(1, (len - DEAD) / (STICK_RADIUS - DEAD));
      const strength = Math.pow(t, 0.45);
      stick.x = nx * strength;
      stick.y = ny * strength;
    } else {
      stick.x = 0;
      stick.y = 0;
    }
  }

  function stickUp(p) {
    if (!stick.active) return;
    if (p && p.id !== undefined && p.id !== stick.pointerId) return;
    stick.active = false;
    stick.pointerId = null;
    stick.x = 0;
    stick.y = 0;
    stick.returnT = 0;
  }

  // ===== 鼠标事件（桌面端拖拽）=====
  canvas.addEventListener('mousedown', function (e) {
    e.preventDefault();
    const p = toLogical(e.clientX, e.clientY);
    stickDown({ id: 'mouse', x: p.x, y: p.y });
  });
  window.addEventListener('mousemove', function (e) {
    if (!stick.active) return;
    const p = toLogical(e.clientX, e.clientY);
    stickMove({ id: 'mouse', x: p.x, y: p.y });
  });
  window.addEventListener('mouseup', function (e) {
    stickUp({ id: 'mouse' });
  });
  window.addEventListener('mouscancel', function (e) {
    stickUp({ id: 'mouse' });
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ===== 触摸事件（移动端）=====
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    // 只取第一个触点，保证单点操控
    const t = e.changedTouches[0];
    if (!t) return;
    const p = toLogical(t.clientX, t.clientY);
    stickDown({ id: t.identifier, x: p.x, y: p.y });
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    // 取合并触摸事件的最新位置，减少输入延迟
    const list = (e.getCoalescedEvents && e.getCoalescedEvents()) || e.changedTouches;
    for (let i = 0; i < list.length; i++) {
      const t = list[i];
      if (t.identifier === stick.pointerId) {
        const p = toLogical(t.clientX, t.clientY);
        stickMove({ id: t.identifier, x: p.x, y: p.y });
      }
    }
  }, { passive: false });

  function endTouch(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === stick.pointerId) {
        stickUp({ id: t.identifier });
      }
    }
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  // 玩家精灵烘焙（2x 超采样：128px 对应 64 逻辑像素；核心灯单独动态绘制以保留脉冲）
  let playerSprite = null;
  function makePlayerSprite() {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const cx = S / 2, cy = S / 2; // 对应逻辑坐标 (0,0)
    function rr(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + r, y);
      g.lineTo(x + w - r, y);
      g.arcTo(x + w, y, x + w, y + r, r);
      g.lineTo(x + w, y + h - r);
      g.arcTo(x + w, y + h, x + w - r, y + h, r);
      g.lineTo(x + r, y + h);
      g.arcTo(x, y + h, x, y + h - r, r);
      g.lineTo(x, y + r);
      g.arcTo(x, y, x + r, y, r);
      g.closePath();
    }
    g.lineJoin = 'round';
    // —— 深紫粗描边底 ——
    g.strokeStyle = COLOR_OUTLINE;
    g.lineWidth = 6.4;
    rr(cx - 19, cy - 19, 38, 36, 10); g.stroke(); // 身体
    g.beginPath(); g.moveTo(cx, cy - 19); g.lineTo(cx, cy - 29); g.stroke(); // 天线
    g.beginPath(); // 两侧小臂
    g.moveTo(cx - 19, cy + 2); g.lineTo(cx - 27, cy + 2);
    g.moveTo(cx + 19, cy + 2); g.lineTo(cx + 27, cy + 2);
    g.stroke();
    // —— 白色主体 ——
    g.fillStyle = COLOR_WHITE;
    rr(cx - 19, cy - 19, 38, 36, 10); g.fill();
    // 头顶盖
    g.strokeStyle = COLOR_OUTLINE; g.lineWidth = 3.2;
    rr(cx - 14, cy - 14, 28, 11, 4); g.stroke();
    // 天线尖端（青色）
    g.fillStyle = COLOR_PLAYER;
    g.beginPath(); g.arc(cx, cy - 30.4, 4.2, 0, Math.PI * 2); g.fill();
    g.strokeStyle = COLOR_OUTLINE; g.lineWidth = 2.4;
    g.beginPath(); g.arc(cx, cy - 30.4, 4.2, 0, Math.PI * 2); g.stroke();
    return c;
  }

  // ===== 程序绘制：玩家 PETRI-07（预渲染精灵版）=====
  function drawPlayer(x, y, t, alpha) {
    const half = player.size / 2;

    // 上下浮动 + 呼吸缩放（动态）
    const floatOffset = Math.sin(t * 3.2) * 2.2;
    const breathe = 1 + Math.sin(t * 3.2 + Math.PI / 2) * 0.045;

    ctx.save();
    // 地面投影（增强浮动感）
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = COLOR_OUTLINE;
    ctx.beginPath();
    ctx.ellipse(x, y + half + 3.5, half * 0.8, half * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.translate(x, y + floatOffset);
    ctx.scale(breathe, breathe);
    ctx.drawImage(playerSprite, -32, -32, 64, 64);

    // —— 青色核心灯（脉冲，动态绘制）——
    const pulse = 0.82 + Math.sin(t * 5.0) * 0.18;
    ctx.globalAlpha = alpha * pulse;
    ctx.fillStyle = COLOR_PLAYER;
    ctx.beginPath();
    ctx.arc(0, 1.5, 3.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 1.5, 3.6, 0, Math.PI * 2);
    ctx.stroke();

    // 核心高光
    ctx.fillStyle = COLOR_WHITE;
    ctx.beginPath();
    ctx.arc(-1.1, 0.3, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // 圆角矩形路径（Canvas 兼容实现）
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // ===== 程序绘制：感染细胞敌人（预渲染精灵版，每帧只做 drawImage + 蠕动缩放）=====
  function drawEnemy(e, t) {
    if (!e.alive) return;          // 死亡帧不绘制（重生前是"空位"）
    const wob = 1 + Math.sin(t * 4.5 * e.wobble + e.seed) * 0.09;
    const half = 24; // 精灵对应 48 逻辑像素
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(wob, wob);
    ctx.drawImage(e.sprite, -half, -half, half * 2, half * 2);
    // 受击白闪：叠一层纯白版精灵，alpha 随 flash 线性衰减
    if (e.flash > 0) {
      ctx.globalAlpha = Math.min(1, e.flash / FLASH_TIME);
      ctx.drawImage(e.spriteWhite, -half, -half, half * 2, half * 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // 生成带扰动的圆形轮廓（让每个细胞形状略有差异）
  function blobPath(x, y, r, seed, inflate) {
    const lobes = 7;
    ctx.beginPath();
    for (let i = 0; i <= lobes; i++) {
      const a = (i / lobes) * Math.PI * 2;
      const wob = 1 + Math.sin(a * 3 + seed) * 0.12 + Math.cos(a * 2 - seed) * 0.07;
      const rr = r * wob + inflate;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // ===== 摇杆绘制 =====
  function drawStick(dt) {
    if (stick.active) {
      // 底座圆圈
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = COLOR_WHITE;
      ctx.beginPath();
      ctx.arc(stick.originX, stick.originY, STICK_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // 底座描边
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = COLOR_PLAYER;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(stick.originX, stick.originY, STICK_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // 摇杆头
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = COLOR_PLAYER;
      ctx.beginPath();
      ctx.arc(stick.knobX, stick.knobY, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COLOR_OUTLINE;
      ctx.lineWidth = 2;
      ctx.stroke();

      // 方向指示线
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = COLOR_PLAYER;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(stick.originX, stick.originY);
      ctx.lineTo(stick.knobX, stick.knobY);
      ctx.stroke();
      ctx.restore();
    } else {
      // 松手后摇杆头回中并淡出
      stick.returnT = Math.min(1, stick.returnT + dt * 5);
      const ease = 1 - stick.returnT;
      if (ease > 0.01) {
        // 回中：向摇杆中心 origin 插值，而不是向 (0,0)
        const kx = lerp(stick.knobX, stick.originX, ease * 0.35);
        const ky = lerp(stick.knobY, stick.originY, ease * 0.35);
        ctx.save();
        ctx.globalAlpha = 0.4 * ease;
        ctx.fillStyle = COLOR_PLAYER;
        ctx.beginPath();
        ctx.arc(kx, ky, 18 * ease + 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  // ===== 边界限制 =====
  function clampToBounds(o, halfW, halfH) {
    o.x = Math.max(halfW, Math.min(LOGICAL_W - halfW, o.x));
    o.y = Math.max(halfH, Math.min(LOGICAL_H - halfH, o.y));
  }

  // ===== 主循环 =====
  let lastTime = performance.now();
  let elapsed = 0;

  function frame(now) {
    // 真实流逝（秒）；上限 0.25s，只防切后台后的死亡螺旋
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.25) dt = 0.25;
    if (dt < 0) dt = 0;

    // 40ms 微 hit-stop：死亡瞬间冻结逻辑时间——子步进与 elapsed 都不推进，
    // 但照常 draw()。这一帧"画面定格"就是打击感的来源（不做震屏、不做伤害数字）。
    // 连续击杀时 hitEnemy 会把 hitStop 反复刷回 0.04s，形成黏住的连顿。
    // 震屏衰减：按真实时间线性衰减，7px 约 0.22s 回零
    if (shake > 0) shake = Math.max(0, shake - 32 * dt);

    let stopped = false;
    if (hitStop > 0) {
      hitStop -= dt;
      if (hitStop < 0) hitStop = 0;
      stopped = true;
    } else {      elapsed += dt;

      // 定步长子步进：此前单帧 dt 钳在 0.05s，导致帧率低于 20fps 时游戏时间比真实时间慢
      // （角色/敌人全部慢动作——正是"慢半拍"的根因）。子步进保证帧率再低，速度也与真实时间一致。
      const STEP = 1 / 60;
      let remaining = dt;
      let guard = 0;
      while (remaining > 1e-6 && guard < 20) {
        const h = Math.min(remaining, STEP);
        update(h);
        remaining -= h;
        guard++;
      }
    }
    // 微顿期间不给摇杆回中插值喂 dt，保持定格的一致性
    lastDt = stopped ? 0 : dt;

    draw(elapsed);
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // —— 玩家移动（摇杆归一化方向 × 移速）；死亡复活读秒时不动 ——
    if (player.deadT <= 0) {
      const moveLen = Math.hypot(stick.x, stick.y);
      if (moveLen > 0.001) {
        player.x += stick.x * PLAYER_SPEED * dt;
        player.y += stick.y * PLAYER_SPEED * dt;
      }
    } else {
      // 死亡：1.2s 后原地满血复活，敌人回边缘（P1 极简，不做结算）
      player.deadT -= dt;
      if (player.deadT <= 0) {
        player.deadT = 0;
        player.hp = player.maxHp;
        player.invuln = 1.0;
        for (let i = 0; i < enemies.length; i++) respawnEnemy(enemies[i], i);
      }
    }
    clampToBounds(player, player.size / 2, player.size / 2);

    // 浮动动画计时 + 无敌帧计时 + 受击红闪计时
    player.animTime += dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (player.hurtFlash > 0) player.hurtFlash -= dt;

    // —— 敌人追踪：瞄准玩家周围的包围点（形成环绕，而非堆叠在玩家身上）——
    // 分离力两阶段计算：先算完所有推力再统一施加，避免"后算的外层循环覆盖先算的结果"
    for (let i = 0; i < enemies.length; i++) {
      enemies[i].sx = 0;
      enemies[i].sy = 0;
    }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue; // 死亡敌人不参与分离
      for (let j = i + 1; j < enemies.length; j++) {
        const o = enemies[j];
        if (!o.alive) continue;
        const ox = e.x - o.x;
        const oy = e.y - o.y;
        const od = Math.hypot(ox, oy);
        const minDist = 30;
        if (od > 0.0001 && od < minDist) {
          const push = (minDist - od) / minDist * ENEMY_SEPARATION;
          const px = (ox / od) * push;
          const py = (oy / od) * push;
          e.sx += px; e.sy += py;
          o.sx -= px; o.sy -= py;
        }
      }
    }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      // 死亡：不动、不索敌，只走重生倒计时；时间到了回屏幕边缘满血回来
      if (!e.alive) {
        e.respawnT -= dt;
        if (e.respawnT <= 0) respawnEnemy(e, i);
        continue;
      }
      // 受击白闪 / 刀刃受击间隔计时（钳到 0，避免子步进残留负值）
      if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
      if (e.bladeCd > 0) e.bladeCd = Math.max(0, e.bladeCd - dt);

      const tx = player.x + Math.cos(e.seed) * e.orbitR;
      const ty = player.y + Math.sin(e.seed) * e.orbitR;
      const dx = tx - e.x;
      const dy = ty - e.y;
      const d = Math.hypot(dx, dy) || 1;
      // 朝包围点移动 + 分离推力
      e.vx = (dx / d) * ENEMY_SPEED + e.sx;
      e.vy = (dy / d) * ENEMY_SPEED + e.sy;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      // 怪-人位置推开（只推怪，不碰主角速度）：P0 关掉的是"怪撞人"的击退手感，
      // 这里补的是视觉分离——怪不许叠进主角。包围点在 30-46px，推开距离 20px 不打架。
      const qx = e.x - player.x, qy = e.y - player.y;
      const qd = Math.hypot(qx, qy);
      const minD = PLAYER_R + ENEMY_R;
      if (qd < minD && qd > 0.0001) {
        e.x = player.x + qx / qd * minD;
        e.y = player.y + qy / qd * minD;
      }
      // 接触伤害：怪贴住主角就咬（0.45s 无敌帧）。P1 之前怪是木桩，这是威胁的来源。
      if (qd < minD + 4 && player.invuln <= 0 && player.deadT <= 0) {
        player.hp -= ENEMY_TOUCH_DMG;
        player.invuln = INVOKED_IFRAME;
        player.hurtFlash = 0.3;
        shake = Math.min(shake + 3, 8);
        spawnDmgNum(player.x, player.y - 10, ENEMY_TOUCH_DMG);
        if (player.hp <= 0) {
          player.hp = 0;
          player.deadT = 1.2; // P1 极简死亡：1.2s 后原地满血复活
        }
      }
    }

    // —— P0 曾关闭碰撞击退（避免包围圈形成"人群阻力"）；P1 仍不处理碰撞伤害，
    // 敌人的威胁性完全由武器反馈（白闪/爆裂/微顿）承担，留给后续原型。

    // —— 三件自动武器（顺序无关紧要：都是围绕当前敌人位置结算）——
    updateBlades(dt);
    updateNeedles(dt);
    updateArcs(dt);
    updateParticles(dt);
    updateDmgNums(dt);
  }

  function draw(t) {
    // 背景
    // 背景：烘焙好的离屏画布，每帧一次 blit
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);
    ctx.restore();

    // 震屏：世界层叠加随机偏移（背景/UI 摇杆不抖）
    if (shake > 0.15) {
      ctx.setTransform(scale, 0, 0, scale,
        offX + (Math.random() - 0.5) * shake,
        offY + (Math.random() - 0.5) * shake);
    }

    // 敌人（内部跳过死亡个体）
    for (let i = 0; i < enemies.length; i++) {
      drawEnemy(enemies[i], t);
    }

    // 电弧：起点连着玩家，压在敌人之上、玩家之下
    drawArcs();

    // 玩家（无敌帧闪烁）
    let alpha = 1;
    if (player.invuln > 0) {
      // 高频闪烁
      alpha = Math.sin(player.invuln * 60) > 0 ? 0.35 : 1;
    }
    drawPlayer(player.x, player.y, player.animTime, alpha);

    // 离心刃（环绕玩家）+ 脉冲针弹体
    drawBlades();
    drawNeedles();

    // 粒子（爆裂/火花在最上层）
    drawParticles();

    // 伤害数字（粒子之上、摇杆之下）
    drawDmgNums();

    // 摇杆（UI 层：先清掉震屏偏移，摇杆不抖）
    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    drawStick(dtForStick());

    // 血条（顶部居中）
    const hbW = 120, hbH = 8, hbX = (LOGICAL_W - hbW) / 2, hbY = 10;
    ctx.fillStyle = 'rgba(10,20,28,0.7)';
    ctx.fillRect(hbX - 1, hbY - 1, hbW + 2, hbH + 2);
    const hpK = player.hp / player.maxHp;
    ctx.fillStyle = hpK > 0.3 ? '#38e8e0' : '#ff5a5a';
    ctx.fillRect(hbX, hbY, hbW * hpK, hbH);

    // 受击红闪（全屏低透明红）
    if (player.hurtFlash > 0) {
      ctx.globalAlpha = Math.min(0.35, player.hurtFlash);
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.globalAlpha = 1;
    }

    // 死亡：中央提示（P1 极简）
    if (player.deadT > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, player.deadT);
      ctx.fillStyle = '#ff5a5a';
      ctx.font = 'bold 20px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('信号中断…', LOGICAL_W / 2, LOGICAL_H / 2 - 40);
      ctx.restore();
    }
  }

  // drawStick 需要 dt 做回中插值，这里保存最近一帧的 dt
  let lastDt = 0;
  function dtForStick() { return lastDt; }

  // 培养皿背景：离屏烘焙一次，resize 时重烘。
  // 之前每帧全屏 fillRect + 26 条网格线 + 全屏径向渐变，是手机端掉帧/输入延迟的主因。
  // 光晕呼吸动画暂 bake 为静态，留给 P4 美术打磨再做动态版。
  let bgCanvas = null;
  function renderBackground() {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = Math.max(1, canvas.width);
    bgCanvas.height = Math.max(1, canvas.height);
    const b = bgCanvas.getContext('2d');
    // 整张先铺底色（含 contain 黑边区）
    b.fillStyle = COLOR_BG;
    b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    b.setTransform(scale, 0, 0, scale, offX, offY);
    // 网格
    b.globalAlpha = 0.05;
    b.strokeStyle = COLOR_PLAYER;
    b.lineWidth = 1;
    const grid = 40;
    b.beginPath();
    for (let x = 0; x <= LOGICAL_W; x += grid) {
      b.moveTo(x, 0);
      b.lineTo(x, LOGICAL_H);
    }
    for (let y = 0; y <= LOGICAL_H; y += grid) {
      b.moveTo(0, y);
      b.lineTo(LOGICAL_W, y);
    }
    b.stroke();
    // 中心微弱光晕
    b.globalAlpha = 0.05;
    const grad = b.createRadialGradient(
      LOGICAL_W / 2, LOGICAL_H / 2, 20,
      LOGICAL_W / 2, LOGICAL_H / 2, LOGICAL_H * 0.7
    );
    grad.addColorStop(0, COLOR_PLAYER);
    grad.addColorStop(1, 'rgba(56,232,224,0)');
    b.fillStyle = grad;
    b.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    b.globalAlpha = 1;
  }

  // ===== 启动 =====
  playerSprite = makePlayerSprite();
  resize();
  requestAnimationFrame(function (now) {
    lastTime = now;
    frame(now);
  });
})();
</script>
</body>
