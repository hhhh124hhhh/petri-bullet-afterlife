<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>培养皿：弹幕余生</title>
<style>
  /* 页面深色背景，Canvas 居中铺满视口 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07121D;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    /* 让 canvas 保持 9:16 比例并尽可能铺满视口 */
    aspect-ratio: 9 / 16;
    height: 100vh; /* 旧浏览器回退 */
    height: 100dvh; /* 动态视口高度：跟随手机地址栏显隐，不用 vh 的"大视口" */
    max-width: 100vw;
    image-rendering: auto;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<script>

(function () {
  'use strict';

  // ===== 逻辑分辨率（竖屏 9:16）=====
  const LOGICAL_W = 360;
  const LOGICAL_H = 640;

  // ===== 色板 =====
  const COLOR_BG = '#07121D';      // 背景深蓝黑
  const COLOR_PLAYER = '#38E8E0'; // 玩家青
  const COLOR_ENEMY = '#FF7138';   // 感染橙
  const COLOR_OUTLINE = '#241638';// 描边深紫
  const COLOR_WHITE = '#F3F7FA';   // 系统白

  // ===== 玩法参数 =====
  const PLAYER_SPEED = 150;   // 玩家移速 px/s（跟手性优先于纸面数值）
  const ENEMY_SPEED = 110;    // 敌人移速 px/s
  const ENEMY_SIZE = 16;      // 敌人逻辑尺寸
  const ENEMY_SEPARATION = 26;// 敌人分离强度系数
  const INVOKED_IFRAME = 0.45; // 无敌帧时长（秒）
  const ENEMY_R = ENEMY_SIZE / 2; // 敌人逻辑半径（碰撞用）
  const PLAYER_R = 12; // 主角逻辑半径（size 24 / 2；怪不许叠进人的推开距离用）
  const BASE_HP = 100;        // 一局初始生命上限（重开时回滚到该值）

  // ===== 敌人种类（P2 决策测试：不同怪需要不同解法）=====
  // normal 感染体：均衡；swift 疾行体：快/脆/咬轻，遛不掉，优先点杀；
  // armored 重甲体：慢/硬/咬重，经验多，"打不打它"本身是决策
  // P2 规格 1.5：重甲体新增"每次受击固定减免 4 点（最低 1 点）"
  // tags 用于下一波预告卡的威胁描述（只给信息，不参与选卡倾向）
  const ARMOR_REDUCE = 4;     // 重甲体每次受击固定减免
  const ENEMY_KINDS = {
    normal:  { name: '感染体', speed: 60, hp: 35,  touch: 6,  size: 16, color: '#E8823C', xp: 1, samples: 1, weight: 8, tags: ['均衡推进', '标准接触伤'] },
    swift:   { name: '疾行体', speed: 90, hp: 20,  touch: 4,  size: 12, color: '#D8E83C', xp: 1, samples: 1, weight: 4, tags: ['高速突进', '脆皮', '咬人轻'] },
    armored: { name: '重甲体', speed: 45, hp: 120, touch: 10, size: 22, color: '#B45BE0', xp: 3, samples: 2, weight: 2, tags: ['高生命', '缓慢推进', '高接触伤害'] },
  };
  const KIND_KEYS = ['normal', 'swift', 'armored'];
  const KIND_LETTER = { I: 'normal', R: 'swift', H: 'armored' }; // 波次序列字母 → 敌人种类

  // ===== 战斗参数（Prototype 1）=====
  const ENEMY_MAX_HP = 35;   // 敌人血量上限
  const FLASH_TIME = 0.08;   // 受击白闪时长（秒）
  const HIT_STOP = 0.04;     // 死亡微顿（秒）：逻辑时间冻结，画面照常绘制
  const DEATH_FADE = 0.25;   // 死亡个体在 enemies 里的保留时长（秒），到期统一摘除

  // 脉冲针（自动单体）—— P2 规格 2.2：Lv1 16 伤 / 0.8s，Lv2 22 伤 / 0.8s
  const NEEDLE_CD = 0.8;      // 发射间隔（秒）
  const NEEDLE_RETRY = 0.1;    // 无目标时的重试间隔（秒）
  const NEEDLE_RANGE = 260;    // 索敌范围
  const NEEDLE_SPEED = 420;    // 弹速 px/s
  const NEEDLE_DMG_TABLE = [16, 22, 27, 31, 35]; // 按等级取值的伤害表（Lv1..Lv5）
  const NEEDLE_POOL = 32;      // 对象池容量
  const NEEDLE_R = 4;          // 弹体逻辑半径
  const NEEDLE_MARGIN = 40;    // 出屏回收余量
  const NEEDLE_FUSE = 2.5;     // 保险丝：兜底回收，避免漏网弹体永久占用池位

  // 离心刃（环绕近战）—— P2 规格 2.2：Lv1 8 伤/目标 / 0.9s / 最多 3 目标
  const BLADE_COUNT = 2;       // 刀刃数量
  const BLADE_RADIUS = 46;     // 环绕半径
  const BLADE_OMEGA = 3.6;     // 角速度 rad/s
  const BLADE_DMG_TABLE = [8, 10, 12, 14, 16]; // 按等级取值的伤害表
  const BLADE_CD = 0.9;        // 命中窗口（秒）：窗口内最多命中 BLADE_MAX_TARGETS 个目标
  const BLADE_MAX_TARGETS = 3; // 单个窗口最多命中目标数（"清群但不无限清"）
  const BLADE_R = 7;           // 刀刃逻辑半径（碰撞用）

  // 培养电弧（弹射）—— P2 规格 2.2：Lv1 6 伤/目标 / 0.8s / 最多 3 目标
  const ARC_CD = 0.8;          // 触发间隔（秒）
  const ARC_RETRY = 0.1;       // 无目标时的重试间隔（秒）
  const ARC_RANGE = 260;       // 首发索敌范围
  const ARC_CHAIN_RANGE = 120; // 弹射索敌范围
  const ARC_JUMPS = 2;         // 弹射次数（首发 + 2 跳 = 最多 3 目标）
  const ARC_DMG_TABLE = [6, 8, 10, 12, 14];    // 按等级取值的伤害表
  const ARC_FALLOFF = 0.8;     // 每次弹射伤害衰减（-20%）
  const ARC_LIFE = 0.12;       // 电弧存在时间（秒）
  const ARC_POOL = 4;          // 并发电弧上限
  const ARC_SEGMENTS = 3;      // 最大折线段数（玩家 → 命中1 → 命中2 → 命中3）
  const ARC_JITTER = 0.34;     // midpoint 抖动幅度系数

  // ===== 构筑系统参数（Prototype 2 / P2 规格 2.1-2.6）=====
  const MAX_SLOTS = 4;              // 机能槽数量（4 槽竞争：装满就装不下新机能）
  const SKILL_LV_CAP = 5;           // 单技能等级上限
  const SKILL_ORDER = ['needle', 'blade', 'arc']; // 武器遍历顺序（发牌用）
  const SLOT_ORDER = ['needle', 'blade', 'arc', 'regen', 'cilia']; // 槽位 UI 展示顺序（武器 + 生存器官）
  const ORGAN_ORDER = ['regen', 'cilia'];   // 生存器官遍历顺序
  const ORGAN_LV_CAP = 2;           // 生存器官等级上限（Lv1 即时兑现，Lv2 补一层）
  const XP_STEP = 3;                // 升到 n+1 级需 n*XP_STEP 点经验
  const HP_CARD_GAIN = 30;          // 扩容卡的生命上限增量（Lv9 前的兜底卡）
  const SPEED_CARD_MULT = 1.15;     // 鞭毛强化的移速乘数（Lv9 前的兜底卡）
  const BRANCH_SAMPLE_COST = 10;    // 分支进化消耗样本
  const BRANCH_MIN_LV = 3;          // 分支进化所需最低等级

  // —— 生存器官（P2 规格 2.4：解决"现在可能死"和"总被追上"）——
  // 再生膜 Lv1：上限 +30 且立即回 24；Lv2：上限 +20 且回 12。占 1 槽。
  const REGEN_TABLE = [{ maxHp: 30, heal: 24 }, { maxHp: 20, heal: 12 }];
  // 运动纤毛 Lv1：移速 +15%；Lv2：再 +8%。占 1 槽。
  const CILIA_TABLE = [0.15, 0.08];

  // —— 循环卡池（P2 规格 2.5：解决 9 级后不再给"生命上限+30"凑数）——
  const LOOP_POOL_LEVEL = 9;   // 达到该等级切换到循环卡池
  const SPEC_FIRST = 0.35;     // 首次专精强化 +35%
  const SPEC_FALLOFF = 0.6;     // 每次再取乘 0.6（衰减）
  const SPEC_FLOOR = 0.08;      // 衰减下限 +8%
  const SPEC_CAP = 0.60;        // 单武器专精累计上限（超出即移除该候选）
  const LOCKED_CHANCE = 0.3;    // 未解锁武器出现在强化池里的概率（不逼玩家提前拿）

  // —— 分支进化（P2 规格 2.6：Lv3 互斥二选一）——
  const THROUGH_EXTRA = 2;          // 贯通针：穿透 +2 名额外敌人
  const THROUGH_FIRST_MULT = 0.9;   // 贯通针：首目标 -10% 伤害
  const PIERCE_ARMOR_MULT = 1.15;   // 破甲针：对重甲 +15% 伤害（并无视减免）

  // —— 战术调频（限时增益，不占槽）——
  const TACTIC_DEFS = [
    { key: 'overload', name: '脉冲超载', desc: '8秒内武器伤害 +30%', dur: 8, mag: 0.30 },
    { key: 'haste',    name: '采样冲刺', desc: '10秒内移速 +25%',    dur: 10, mag: 0.25 },
    { key: 'guard',    name: '代谢抑制', desc: '8秒内受击伤害 -35%', dur: 8, mag: 0.35 },
  ];

  // ===== 波次调度（P2 规格 1.2-1.4）=====
  // [start, end, interval, rest, waveName, enemySequence]  I=感染体 R=疾行体 H=重甲体
  // rest 包含在波次总时长内：[start, end-rest) 出怪，[end-rest, end) 收尾+喘息
  const WAVES = [
    [  0,  20, 2.0 , 3, '初始感染', 'IIIIII'       ],
    [ 20,  40, 1.5 , 3, '感染增殖', 'IIIIIIII'     ],
    [ 40,  60, 1.5 , 3, '首次快攻', 'IIRIRIRIR'    ],
    [ 60,  80, 1.5 , 3, '疾行围猎', 'RIRRIRRIRR'   ],
    [ 80, 105, 2.0 , 4, '装甲突破', 'HIHIHIH'      ],
    [105, 130, 1.5 , 4, '混合压力', 'IRHIRIRHIRIR' ],
    [130, 155, 1.5 , 4, '疾行冲击', 'RRIRRIRRIRRR' ],
    [155, 180, 1.65, 4, '重甲推进', 'HHHIHHIHII'   ],
  ];
  const LOOP_FROM = WAVES[WAVES.length - 1][1];  // 180s 之后进入循环段
  const LOOP_FIRST = 5;                          // 循环段从 W6（混合压力）开始
  const LOOP_LEN = LOOP_FROM - WAVES[LOOP_FIRST][0]; // 75s：W6→W7→W8
  const LOOP_HP_PER_ROUND = 0.10;                // 每循环一轮，敌人血量 +10%
  const WAVE_SOFT_CAP = 8;                       // 场上存活软上限：满则延期投放（硬规则 3）
  const MIN_SPAWN_GAP = 0.9;                     // 全局最小出生间隔（秒，硬规则 3）
  const PREVIEW_LEN = 3;                         // PREVIEW 阶段时长（秒）
  const CLEANUP_FADE = 1.6;                      // CLEANUP 残敌退场淡出时长（秒）
  const SECTOR_SPREAD = Math.PI / 3;             // 出生角度：波次扇区中心 ±60°
  // 每波扇区中心（度，0=右，顺时针为正）：让怪从可预期的一侧压过来
  const WAVE_SECTORS = [-90, 0, 90, 180, -45, 45, 135, -135];
  const SAMPLE_POOL = 40;           // 样本点对象池容量（固定，不扩容）
  const SAMPLE_PICK_R = 24;         // 样本拾取半径
  const SAMPLE_R = 4;               // 样本绘制半径
  const CARD_W = 300;               // 三选一卡片宽
  const CARD_H = 108;               // 三选一卡片高（加高，信息分层）
  const CARD_GAP = 16;              // 卡片间距
  const SLOT_UI_SIZE = 30;          // 技能槽格子边长

  // 粒子系统
  const PARTICLE_POOL = 200;   // 粒子对象池容量（固定，不扩容）

  // ===== 摇杆参数（视觉与响应统一半径，避免"手在动、杆不动"的脱节感）=====
  const STICK_RADIUS = 50; // 手指拖到 50px 即满速

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 自适应缩放：把逻辑坐标映射到实际画布尺寸 =====
  let scale = 1;
  let dpr = 1;
  let offX = 0, offY = 0; // contain 居中偏移（模块级，供背景烘焙使用）

  function resize() {
    // DPR 上限 2：移动端 fill-rate 优先，2x 对本作像素风已足够锐利
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.round(rect.width);
    const cssH = Math.round(rect.height);

    // 非法尺寸拒绝：手机浏览器地址栏显隐、布局过渡时会触发瞬时极小尺寸，
    // 直接采用会把 canvas 设成一小块且回不来。小于 200px 或不足当前 40% 则忽略。
    if (cssW < 200 || cssH < 200) return;
    const prevW = canvas.width / dpr, prevH = canvas.height / dpr;
    if (prevW > 0 && (cssW < prevW * 0.4 || cssH < prevH * 0.4)) return;

    // 后备缓冲按 devicePixelRatio 放大
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);

    // 逻辑 360x640 等比缩放铺满画布（contain），居中
    scale = Math.min(canvas.width / LOGICAL_W, canvas.height / LOGICAL_H);
    offX = (canvas.width - LOGICAL_W * scale) / 2;
    offY = (canvas.height - LOGICAL_H * scale) / 2;

    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.imageSmoothingEnabled = true;

    renderBackground(); // 尺寸变化时重烘背景
  }

  // 防抖：地址栏动画会连发多次 resize，150ms 内只执行最后一次
  let resizeTimer = 0;
  function debouncedResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resizeTimer = 0; resize(); }, 150);
  }

  window.addEventListener('resize', debouncedResize);
  window.addEventListener('orientationchange', debouncedResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', debouncedResize);
  }
  // （orientationchange 已并入上面的 debouncedResize）

  // ===== 玩家状态 =====
  const player = {
    x: LOGICAL_W / 2,
    y: LOGICAL_H - 140,
    size: 24,
    invuln: 0,     // 剩余无敌时间
    animTime: 0,   // 浮动动画计时
    hp: BASE_HP, maxHp: BASE_HP, // 生命（P1：怪有接触伤害了，主角得有血条）
    hurtFlash: 0   // 受击红闪计时
    // 注：不再有 deadT。死亡 = 冻结 + 死亡结算面板（见 UIState.DEAD）
  };
  const ENEMY_TOUCH_DMG = 6; // 怪接触伤害

  // ===== 构筑状态（Prototype 2 / P2 规格）=====
  // branch: null | 'through' | 'pierce'（不可逆，只能写一次，P2 规格 2.6）
  const skills = {
    needle: { owned: true,  lv: 1, branch: null },
    blade:  { owned: false, lv: 0, branch: null },
    arc:    { owned: false, lv: 0, branch: null }
  };
  // 技能主题色（美术 issue：刃=霓虹橙、弧=霓虹紫；针保持青）
  // icon 指向 assets/icons/*.png；图片缺失时绘制侧回退到 short 文字（见 drawSlots）
  const SKILL_META = {
    needle: { name: '脉冲针', short: '针', color: '#38E8E0', icon: 'assets/icons/needle.png' },
    blade:  { name: '离心刃', short: '刃', color: '#FF7A1A', icon: 'assets/icons/blade.png' },
    arc:    { name: '培养电弧', short: '弧', color: '#B45BE0', icon: 'assets/icons/arc.png' }
  };
  // 生存器官（P2 规格 2.4）：各占 1 槽，同一机能只允许一个实例
  const ORGAN_META = {
    regen: { name: '再生膜',   short: '膜', color: '#5BE08C' },
    cilia: { name: '运动纤毛', short: '纤', color: '#FFD75E' },
  };
  const organs = {
    regen: { owned: false, lv: 0 },
    cilia: { owned: false, lv: 0 },
  };
  // 技能图标预加载
  const SKILL_ICONS = {};
  for (const k in SKILL_META) {
    if (SKILL_META[k].icon) {
      const img = new Image();
      img.src = SKILL_META[k].icon;
      SKILL_ICONS[k] = img;
    }
  }
  let playerLevel = 1;
  let playerXp = 0;
  let xpNext = XP_STEP;  // 升到 n+1 级需 n*XP_STEP 点经验
  let pendingLevels = 0; // 待结算升级数（>0 且能开 UI 时弹三选一）
  let samples = 0;        // SAMPLE 计数
  let uiOpen = false;     // 三选一 UI 打开：update 冻结、摇杆输入忽略
  let branchMode = false; // 分支子选择中（两张分支卡 + 返回）
  let speedMult = 1;      // 移速乘区（运动纤毛 / 鞭毛强化共用）
  // —— 一局统计（死亡结算面板读取，冻结后不再变化）——
  let killCount = 0;      // 本局击杀数
  let runSamples = 0;     // 本局累计拾取样本数（只增不减；samples 是可消耗余额）
  // —— P2 构筑决策 A-E 运行时状态（重开时必须一并清零）——
  const skillBonus = { needle: 0, blade: 0, arc: 0 };   // 专精累计加成（可重复获取）
  const specCount = { needle: 0, blade: 0, arc: 0 };     // 专精获取次数（决定数值衰减）
  const buffs = { overload: 0, haste: 0, guard: 0 };     // 战术调频剩余时间（秒）
  let allDmgBonus = 0;      // 过载超频累计（全武器伤害 +N%，可重复）
  let xpMult = 1;           // 战术重整经验乘区（本次战斗 +10%，可重复）

  // ===== 敌人集合 =====
  // P2：不再有"恒定 14 只"的固定池。数组由 WaveDirector 投放 push、
  // 死亡后延迟由 compactEnemies 摘除（死亡不补位，硬规则 1）。
  const enemies = [];

  // 沿指定方向求出屏点：保证新怪"从某一侧进来"，而不是糊在玩家身上
  const rayScratch = { x: 0, y: 0 };
  function rayExit(a) {
    const cx = player.x, cy = player.y;
    const dx = Math.cos(a), dy = Math.sin(a);
    const m = 30; // 出屏余量
    let t = 0;
    if (dx > 1e-6) t = Math.max(t, (LOGICAL_W + m - cx) / dx);
    else if (dx < -1e-6) t = Math.max(t, (-m - cx) / dx);
    if (dy > 1e-6) t = Math.max(t, (LOGICAL_H + m - cy) / dy);
    else if (dy < -1e-6) t = Math.max(t, (-m - cy) / dy);
    if (t <= 0) t = 40;
    rayScratch.x = cx + dx * t;
    rayScratch.y = cy + dy * t;
    return rayScratch;
  }

  // 波次投放一只敌人：kind 由波次序列决定，angle 为该波扇区内的随机方向
  function spawnEnemy(kind, angle, hpMult) {
    const p = rayExit(angle);
    const K = ENEMY_KINDS[kind];
    const hp = K.hp * hpMult;
    enemies.push({
      x: p.x,
      y: p.y,
      vx: 0,
      vy: 0,
      // 包围角 = 出场方向：怪按"从哪来"的角度贴上来，避免角度扎堆
      seed: angle + (Math.random() - 0.5) * 0.25,
      wobble: 0.6 + Math.random() * 0.8, // 每只细胞的蠕动相位频率
      orbitR: 45 + Math.random() * 25,   // 包围半径 45-70：松一圈，不糊脸；刀刃在 46px，近端怪仍在刀刃范围内
      kind: kind,                        // normal / swift / armored
      speed: K.speed,
      touchDmg: K.touch,
      xpValue: K.xp,
      sampleValue: K.samples,
      er: K.size / 2,                    // 本体碰撞半径（按种类）
      sprite: ENEMY_SPRITES[kind],         // 预渲染精灵（按种类）
      spriteWhite: ENEMY_WHITE_SPRITES[kind], // 受击白闪用的纯白版
      hp: hp,
      maxHp: hp,
      alive: true,
      retreating: false,  // CLEANUP 退场中：不给经验/不掉落/不咬人
      fadeT: 0,           // 退场淡出进度（retreating 时递减）
      flash: 0,
      bladeCd: 0,
      sx: 0, sy: 0 // 分离推力缓存（两阶段计算用）
    });
  }

  // ============================================================
  // WaveDirector（P2 规格 1.2-1.4）
  // 波次调度器统一创建敌人：PREVIEW → SPAWNING → CLEANUP → REST。
  // 与预告共用同一个游戏时钟 elapsed（硬规则 6）。
  // ============================================================

  // 某个"波次实例"的起始时刻（round=0 为首轮 8 波；round>=1 为 W6-W8 循环轮）
  function waveStartTime(i, round) {
    if (round <= 0) return WAVES[i][0];
    return LOOP_FROM + (round - 1) * LOOP_LEN + (WAVES[i][0] - WAVES[LOOP_FIRST][0]);
  }

  // 当前时钟落在哪个波次实例：{ i, round, start, end, hpMult }
  function waveDefAt(t) {
    if (t < LOOP_FROM) {
      for (let i = 0; i < WAVES.length; i++) {
        const W = WAVES[i];
        if (t >= W[0] && t < W[1]) return mkWaveInst(i, 0);
      }
      const last = WAVES.length - 1;
      return mkWaveInst(last, 0);
    }
    const k = Math.floor((t - LOOP_FROM) / LOOP_LEN);       // 已完成的循环轮数
    const local = t - LOOP_FROM - k * LOOP_LEN;            // 本轮内偏移
    for (let i = LOOP_FIRST; i < WAVES.length; i++) {
      const W = WAVES[i];
      if (local >= W[0] - WAVES[LOOP_FIRST][0] && local < W[1] - WAVES[LOOP_FIRST][0]) {
        return mkWaveInst(i, k + 1);
      }
    }
    return mkWaveInst(WAVES.length - 1, k + 1);
  }

  function mkWaveInst(i, round) {
    const W = WAVES[i];
    return {
      i: i, round: round,
      start: waveStartTime(i, round),
      end: waveStartTime(i, round) + (W[1] - W[0]),
      hpMult: 1 + round * LOOP_HP_PER_ROUND // 循环轮每轮 +10% 血量
    };
  }

  // 下一波实例（预告数据源）：首轮按序推进，末波回卷到 W6 循环段
  function nextWaveInst(cur) {
    if (cur.i + 1 < WAVES.length) return mkWaveInst(cur.i + 1, cur.round);
    return mkWaveInst(LOOP_FIRST, cur.round + 1);
  }

  // 当前波次的运行时调度数据（唯一的"真实调度"来源，UI 预告与实际投放共用）
  // i: -1 是哨兵值：保证 t=0 时 updateWaveDirector 一定先跑一次 beginWave 建立 W1
  const waveNow = {
    i: -1, round: 0, start: 0, end: 0, name: '', seq: '',
    interval: 2, rest: 3, hpMult: 1,
    previewEnd: 0, spawnEnd: 0, restStart: 0,
    phase: 'preview', cursor: 0, lastSpawnAt: -99,
    spawned: 0, dropped: 0 // 已投放数 / 因窗口关闭被取消的投放任务数
  };

  // 切换到新的波次实例：建队列 + 回到 PREVIEW（硬规则 2、6）
  function beginWave(inst) {
    const W = WAVES[inst.i];
    waveNow.i = inst.i;
    waveNow.round = inst.round;
    waveNow.start = inst.start;
    waveNow.end = inst.end;
    waveNow.name = W[4];
    waveNow.seq = W[5];
    waveNow.interval = W[2];
    waveNow.rest = W[3];
    waveNow.hpMult = inst.hpMult;
    waveNow.spawnEnd = inst.end - W[3];                       // 到 end-rest 关闭投放窗口
    waveNow.previewEnd = inst.start + Math.min(PREVIEW_LEN, (waveNow.spawnEnd - inst.start) * 0.25);
    waveNow.restStart = waveNow.spawnEnd + W[3] * 0.5;        // rest 前半收尾、后半喘息
    waveNow.phase = 'preview';
    waveNow.cursor = 0;                                      // 队列游标：一波计划 N 只就有 N 个任务
    waveNow.lastSpawnAt = -99;
    waveNow.spawned = 0;
    waveNow.dropped = 0;
  }

  function aliveEnemyCount() {
    let n = 0;
    for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) n++;
    return n;
  }

  // CLEANUP：停止出生后残敌退场，不给经验/不掉落（硬规则 4、5）
  function beginCleanup() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || e.retreating) continue;
      e.retreating = true;
      e.fadeT = CLEANUP_FADE;
      e.xpValue = 0;        // 双保险：退场个体不产出任何构筑资源
      e.sampleValue = 0;
    }
  }

  // 每帧推进波次状态机。调用方保证 elapsed 是当前逻辑时钟
  function updateWaveDirector() {
    const inst = waveDefAt(elapsed);
    if (inst.i !== waveNow.i || inst.round !== waveNow.round) beginWave(inst);
    const t = elapsed;

    if (t < waveNow.previewEnd) waveNow.phase = 'preview';
    else if (t < waveNow.spawnEnd) waveNow.phase = 'spawning';
    else if (t < waveNow.restStart) {
      if (waveNow.phase !== 'cleanup') { waveNow.phase = 'cleanup'; beginCleanup(); }
    } else waveNow.phase = 'rest';

    if (waveNow.phase !== 'spawning') return;

    // 队列守恒：序列有几个字符就有几个投放任务，按序投放
    while (waveNow.cursor < waveNow.seq.length) {
      const at = waveNow.previewEnd + waveNow.cursor * waveNow.interval;
      if (t < at) break;                                       // 还没到计划时刻
      if (t >= waveNow.spawnEnd) {                              // 硬规则 4：窗口关闭，未投放任务取消
        waveNow.dropped = waveNow.seq.length - waveNow.cursor;
        waveNow.cursor = waveNow.seq.length;
        break;
      }
      if (aliveEnemyCount() >= WAVE_SOFT_CAP) break;            // 硬规则 3：软上限满 → 延期投放
      if (t - waveNow.lastSpawnAt < MIN_SPAWN_GAP) break;       // 硬规则 3：全局出生间隔 ≥0.9s
      const ch = waveNow.seq[waveNow.cursor];
      const center = WAVE_SECTORS[waveNow.i] * Math.PI / 180;
      const angle = center + (Math.random() - 0.5) * 2 * SECTOR_SPREAD;
      spawnEnemy(KIND_LETTER[ch] || 'normal', angle, waveNow.hpMult);
      waveNow.cursor++;
      waveNow.spawned++;
      waveNow.lastSpawnAt = t;
    }
  }

  // 波次序列画像：主敌种 / 占比 / 威胁描述（预告卡用，只给信息不做推荐）
  function waveProfile(seq) {
    const counts = { I: 0, R: 0, H: 0 };
    for (let i = 0; i < seq.length; i++) if (counts[seq[i]] !== undefined) counts[seq[i]]++;
    let best = 'I', bestN = -1;
    for (const k in counts) if (counts[k] > bestN) { best = k; bestN = counts[k]; }
    const kind = KIND_LETTER[best];
    const ratio = Math.round((bestN / seq.length) * 20) * 5; // 取到 5% 整数
    return { kind: kind, ratio: ratio, tags: ENEMY_KINDS[kind].tags };
  }

  // 下一波预告信息（真实调度数据：与 updateWaveDirector 共用 elapsed）
  function nextWaveInfo() {
    const nxt = nextWaveInst(waveDefAt(elapsed));
    const W = WAVES[nxt.i];
    return {
      label: 'W' + (nxt.i + 1),
      name: W[4],
      round: nxt.round,
      remain: Math.max(0, nxt.start - elapsed),
      profile: waveProfile(W[5])
    };
  }

  // 摘除已彻底消失的个体（死亡淡出/退场结束），倒序换位删除，避免迭代中改数组
  function compactEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.alive) continue;
      e.fadeT -= dt;
      if (e.fadeT > 0) continue;
      enemies[i] = enemies[enemies.length - 1];
      enemies.pop();
    }
  }

  // 清场：玩家死亡重生时把残留个体一次清空（不给经验/掉落）
  function clearEnemies() {
    enemies.length = 0;
  }

  // 敌人精灵烘焙（2x 超采样：96px 画布对应 48 逻辑像素），按种类烘焙（颜色+尺寸）
  function makeEnemySprite(seed, color, size) {
    const S = 96;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const cx = S / 2, cy = S / 2;
    const r = (size / 2) * 2; // 逻辑直径 size → 精灵内半径
    function blob(x, y, rr, sd, inflate) {
      const lobes = 7;
      g.beginPath();
      for (let i = 0; i <= lobes; i++) {
        const a = (i / lobes) * Math.PI * 2;
        const w = 1 + Math.sin(a * 3 + sd) * 0.12 + Math.cos(a * 2 - sd) * 0.07;
        const q = rr * w + inflate;
        const px = x + Math.cos(a) * q;
        const py = y + Math.sin(a) * q;
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath();
    }
    // 深紫描边底
    g.fillStyle = COLOR_OUTLINE;
    blob(cx, cy, r + 4.4, seed, 2); g.fill();
    // 种类色主体
    g.fillStyle = color;
    blob(cx, cy, r, seed, 0); g.fill();
    // 内部暗核 + 高光
    g.fillStyle = COLOR_OUTLINE; g.globalAlpha = 0.55;
    g.beginPath(); g.arc(cx - r * 0.18, cy + r * 0.2, r * 0.3, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.5; g.fillStyle = COLOR_WHITE;
    g.beginPath(); g.arc(cx - r * 0.34, cy - r * 0.36, r * 0.22, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    return c;
  }
  const ENEMY_SPRITES = {
    normal: makeEnemySprite(0.7, ENEMY_KINDS.normal.color, ENEMY_KINDS.normal.size),
    swift: makeEnemySprite(2.1, ENEMY_KINDS.swift.color, ENEMY_KINDS.swift.size),
    armored: makeEnemySprite(4.2, ENEMY_KINDS.armored.color, ENEMY_KINDS.armored.size),
  };

  // 受击白闪：把精灵拷到离屏画布，用 source-in 只保留形状填成纯白
  function makeWhiteVersion(src) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  const ENEMY_WHITE_SPRITES = {
    normal: makeWhiteVersion(ENEMY_SPRITES.normal),
    swift: makeWhiteVersion(ENEMY_SPRITES.swift),
    armored: makeWhiteVersion(ENEMY_SPRITES.armored)
  };

  // P2：开局场上无怪。首波由 WaveDirector 在 PREVIEW 结束后按序列投放。

  // ============================================================
  // 战斗系统（Prototype 1）
  // 三件自动武器 + 粒子 + 死亡反馈。弹体/粒子/电弧全部对象池，
  // 点位与锯齿折线都在释放那一刻算好，稳态下每帧零分配。
  // ============================================================

  // —— 粒子点精灵（白 / 青 / 橙；32px 画布对应 16 逻辑像素，2x）——
  function makeDotSprite(color) {
    const S = 32, R = 16;
    const c = document.createElement('canvas');
    c.width = S; c.height = S;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(R, R, 0, R, R, R);
    grad.addColorStop(0, COLOR_WHITE);
    grad.addColorStop(0.3, color);
    grad.addColorStop(0.62, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, S, S);
    return c;
  }
  const COLOR_SAMPLE = '#5BE08C'; // SAMPLE 样本绿
  const PARTICLE_SPRITES = [makeDotSprite(COLOR_WHITE), makeDotSprite(COLOR_PLAYER), makeDotSprite(COLOR_ENEMY), makeDotSprite(COLOR_SAMPLE)];
  const P_WHITE = 0, P_CYAN = 1, P_ORANGE = 2, P_GREEN = 3;

  // —— 粒子对象池（固定 200，life <= 0 视为空槽）——
  const particles = [];
  for (let i = 0; i < PARTICLE_POOL; i++) {
    particles.push({
      x: 0, y: 0, vx: 0, vy: 0,
      life: 0, maxLife: 1,
      size: 1,
      sprite: PARTICLE_SPRITES[P_WHITE]
    });
  }

  function spawnParticle(x, y, vx, vy, life, size, sprite) {
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) {           // 命中火花/爆裂高频触发，优先吃刚空出来的槽
        p.x = x; p.y = y;
        p.vx = vx; p.vy = vy;
        p.life = life; p.maxLife = life;
        p.size = size;
        p.sprite = sprite;
        return true;
      }
    }
    return false;                 // 池满直接丢弃，绝不扩容
  }

  function updateParticles(dt) {
    const drag = Math.min(1, 6 * dt); // 线性减速
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      p.life -= dt;
      if (p.life <= 0) { p.life = 0; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx -= p.vx * drag;
      p.vy -= p.vy * drag;
    }
  }

  function drawParticles() {
    for (let i = 0; i < PARTICLE_POOL; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      const k = p.life / p.maxLife;
      const s = p.size * (0.35 + 0.65 * k); // 尾部收缩，配合 alpha 淡出
      ctx.globalAlpha = k;
      ctx.drawImage(p.sprite, p.x - s, p.y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
  }

  // 命中火花：4 粒，青白混合
  function spawnSparks(x, y) {
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 100; // 40~140 px/s
      spawnParticle(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        0.2 + Math.random() * 0.15,       // 0.2~0.35s
        2 + Math.random() * 2,
        i % 2 === 0 ? PARTICLE_SPRITES[P_WHITE] : PARTICLE_SPRITES[P_CYAN]
      );
    }
  }

  // 死亡爆裂：24 粒，橙白混合径向飞散（P1 反馈加强版：量大、初速高）
  const BURST_COUNT = 24;
  function spawnDeathBurst(x, y) {
    const base = Math.random() * Math.PI * 2;
    for (let i = 0; i < BURST_COUNT; i++) {
      const a = base + (i / BURST_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const sp = 80 + Math.random() * 180; // 80~260 px/s
      spawnParticle(
        x, y,
        Math.cos(a) * sp, Math.sin(a) * sp,
        0.35 + Math.random() * 0.25,       // 0.35~0.6s
        4 + Math.random() * 4,
        i % 3 === 0 ? PARTICLE_SPRITES[P_WHITE] : PARTICLE_SPRITES[P_ORANGE]
      );
    }
  }

  // —— 伤害结算：白闪 + 死亡反馈（death 触发爆裂、微顿、震屏）——
  let hitStop = 0; // 剩余微顿时间（秒），由 frame() 消费
  let shake = 0;   // 屏幕震动强度（px），frame() 里按真实时间衰减

  // —— 伤害数字对象池（24 个，命中即刷，不扩容）——
  const DMG_NUM_POOL = 24;
  const dmgNums = [];
  for (let i = 0; i < DMG_NUM_POOL; i++) {
    dmgNums.push({ life: 0, maxLife: 0.6, x: 0, y: 0, value: 0 });
  }
  let dmgNumCursor = 0;
  function spawnDmgNum(x, y, value) {
    const d = dmgNums[dmgNumCursor];
    dmgNumCursor = (dmgNumCursor + 1) % DMG_NUM_POOL;
    d.x = x + (Math.random() - 0.5) * 10;
    d.y = y - 8;
    d.value = Math.round(value);
    d.life = d.maxLife;
  }
  function updateDmgNums(dt) {
    for (let i = 0; i < DMG_NUM_POOL; i++) {
      const d = dmgNums[i];
      if (d.life <= 0) continue;
      d.life -= dt;
      d.y -= 38 * dt; // 上浮
    }
  }
  function drawDmgNums() {
    ctx.save();
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < DMG_NUM_POOL; i++) {
      const d = dmgNums[i];
      if (d.life <= 0) continue;
      const k = d.life / d.maxLife;
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.fillStyle = '#ffd75e';
      ctx.fillText(d.value, d.x, d.y);
    }
    ctx.restore();
  }

  // 伤害结算入口。pierceArmor=true 时为破甲针弹：无视重甲减免并对重甲 +15%
  function hitEnemy(e, dmg, pierceArmor) {
    if (!e.alive || e.retreating) return;
    // 破甲针：对重甲 +15%
    if (pierceArmor && e.kind === 'armored') dmg *= PIERCE_ARMOR_MULT;
    // 重甲减免：每次受击固定减免 4 点（最低 1 点）。破甲针无视。
    // 规格 2.2 校核：离心刃 8 伤打重甲剩 4，脉冲针 Lv2 22 伤打重甲剩 18。
    if (e.kind === 'armored' && !pierceArmor) dmg = Math.max(1, dmg - ARMOR_REDUCE);
    e.hp -= dmg;
    e.flash = FLASH_TIME;
    spawnDmgNum(e.x, e.y, dmg);
    if (e.hp <= 0) {
      e.alive = false;
      e.hp = 0;
e.fadeT = DEATH_FADE; // 死亡不补位（硬规则 1）：只保留一小段淡出后摘除
      killCount++;                 // 结算面板"击杀"统计
      spawnDeathBurst(e.x, e.y);
      // 40ms 微顿：连续死亡不断刷新为 0.04s，手感上就是"一串黏住的顿"
      hitStop = HIT_STOP;
      // 死亡震屏：叠加但封顶 7px，连杀不糊
      shake = Math.min(shake + 2.5, 7);
      // P2：死亡给构筑资源（经验 + 样本，按种类：重甲给 3 经验 2 样本）
      gainXp(e.xpValue);
      for (let k = 0; k < e.sampleValue; k++) dropSample(e.x, e.y);
    }
  }

  // 最近的存活敌人；exclude 为已命中列表（电弧弹射去重）。退场个体不参与索敌。
  function nearestEnemy(x, y, range, exclude, excludeCount) {
    let best = null;
    let bestD = range * range;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || e.retreating) continue;
      if (exclude) {
        let skip = false;
        for (let j = 0; j < excludeCount; j++) {
          if (exclude[j] === e) { skip = true; break; }
        }
        if (skip) continue;
      }
      const dx = e.x - x, dy = e.y - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  }

  // ===== 脉冲针（自动单体）=====
  // 40x12px 画布对应 20x6 逻辑像素，朝 +X；绘制时按速度方向旋转
  function makeNeedleSprite() {
    const W = 40, H = 12;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.lineJoin = 'round'; g.lineCap = 'round';
    // 深紫描边底
    g.strokeStyle = COLOR_OUTLINE;
    g.lineWidth = 4.2;
    g.beginPath();
    g.moveTo(4, H / 2);
    g.lineTo(W - 4, H / 2);
    g.stroke();
    // 青色针身：尾淡 → 尖锐白头
    const grad = g.createLinearGradient(2, 0, W - 2, 0);
    grad.addColorStop(0, 'rgba(56,232,224,0.25)');
    grad.addColorStop(0.45, COLOR_PLAYER);
    grad.addColorStop(1, COLOR_WHITE);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(2, H / 2 - 2.4);
    g.lineTo(W - 2.5, H / 2);
    g.lineTo(2, H / 2 + 2.4);
    g.closePath();
    g.fill();
    return c;
  }
  const needleSprite = new Image();
  needleSprite.src = 'assets/icons/needle-bullet.png';
  const NEEDLE_L = 20, NEEDLE_HGT = 6;

  const needles = [];
  for (let i = 0; i < NEEDLE_POOL; i++) {
    // pierceUsed：贯通分支已贯穿的目标数（首目标 +2 名额外）；lastHit：本次飞行已打过的目标
    needles.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, life: 0, pierceUsed: 0, lastHit: null });
  }
  let needleCursor = 0;
  let needleCd = NEEDLE_CD;

  // 分配一个池槽位并沿角度 a 发射
  function spawnNeedleAt(a) {
    let slot = null;
    let idx = 0;
    for (let i = 0; i < NEEDLE_POOL; i++) {
      const c = needles[(needleCursor + i) % NEEDLE_POOL];
      if (!c.active) { slot = c; idx = (needleCursor + i) % NEEDLE_POOL; break; }
    }
    if (!slot) return; // 池满（本不该发生）直接放弃这次发射
    needleCursor = (idx + 1) % NEEDLE_POOL;

    slot.active = true;
    slot.x = player.x + Math.cos(a) * 12; // 从体表射出，避免贴脸立刻命中
    slot.y = player.y + Math.sin(a) * 12;
    slot.vx = Math.cos(a) * NEEDLE_SPEED;
    slot.vy = Math.sin(a) * NEEDLE_SPEED;
    slot.rot = a;
    slot.life = NEEDLE_FUSE;
    slot.pierceUsed = 0;
    slot.lastHit = null;
  }

  function fireNeedle(target) {
    const a = Math.atan2(target.y - player.y, target.x - player.x);
    spawnNeedleAt(a);
  }

  const NEEDLE_HIT_R = ENEMY_R + NEEDLE_R;
  const NEEDLE_HIT_R2 = NEEDLE_HIT_R * NEEDLE_HIT_R;

  function updateNeedles(dt) {
    if (!skills.needle.owned) return;
    needleCd -= dt;
    if (needleCd <= 0) {
      const target = nearestEnemy(player.x, player.y, NEEDLE_RANGE, null, 0);
      if (target) { fireNeedle(target); needleCd = NEEDLE_CD; }
      else needleCd = NEEDLE_RETRY; // 无目标：0.1s 后重试
    }

    for (let i = 0; i < NEEDLE_POOL; i++) {
      const p = needles[i];
      if (!p.active) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot = Math.atan2(p.vy, p.vx);
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }

      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (!e.alive || e.retreating || e === p.lastHit) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        const hr = e.er + NEEDLE_R; // 按怪体型算命中半径
        if (dx * dx + dy * dy <= hr * hr) {
          // 分支"贯通针"：首目标 -10%，之后继续贯穿 2 名敌人；未分支时命中即回收
          const through = skills.needle.branch === 'through';
          const isFirst = p.pierceUsed === 0;
          hitEnemy(e, needleDmg() * (through && isFirst ? THROUGH_FIRST_MULT : 1),
                   skills.needle.branch === 'pierce');
          spawnSparks(p.x, p.y);
          if (through) {
            p.pierceUsed++;
            p.lastHit = e;
            if (p.pierceUsed > THROUGH_EXTRA) { p.active = false; break; } // 贯穿额度用尽
            continue; // 保留弹体，继续找下一个目标
          }
          p.active = false; // 命中即回收
          break;
        }
      }
      if (!p.active) continue;
      // 出屏 40px 回收
      if (p.x < -NEEDLE_MARGIN || p.x > LOGICAL_W + NEEDLE_MARGIN ||
          p.y < -NEEDLE_MARGIN || p.y > LOGICAL_H + NEEDLE_MARGIN) {
        p.active = false;
      }
    }
  }

  function drawNeedles() {
    if (!skills.needle.owned) return;
    for (let i = 0; i < NEEDLE_POOL; i++) {
      const p = needles[i];
      if (!p.active) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(needleSprite, -NEEDLE_L / 2, -NEEDLE_HGT / 2, NEEDLE_L, NEEDLE_HGT);
      ctx.restore();
    }
  }

  // ===== 离心刃（环绕近战）=====
  // 32x16px 画布对应 16x8 逻辑像素，新月薄刃，朝 +X
  function makeBladeSprite() {
    const W = 32, H = 16;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(2, 8);
    g.quadraticCurveTo(16, 1.8, 30, 6);   // 刃背
    g.quadraticCurveTo(16, 10.2, 2, 8);  // 刃腹（两点相交成细月牙）
    g.closePath();
    g.strokeStyle = COLOR_OUTLINE;
    g.lineWidth = 3.2;
    g.stroke();
    g.fillStyle = SKILL_META.blade.color; // 美术 issue：刃=霓虹橙
    g.fill();
    // 刃口高光
    g.strokeStyle = COLOR_WHITE;
    g.lineWidth = 1.3;
    g.beginPath();
    g.moveTo(4.5, 7.2);
    g.quadraticCurveTo(16, 3.6, 28.5, 6.3);
    g.stroke();
    return c;
  }
  const bladeSprite = makeBladeSprite();
  const BLADE_L = 16, BLADE_HGT = 8;

  let bladeAngle = 0;
  const bladeX = new Float32Array(BLADE_COUNT);
  const bladeY = new Float32Array(BLADE_COUNT);
  const bladeRot = new Float32Array(BLADE_COUNT);
  const BLADE_HIT_R = ENEMY_R + BLADE_R;
  const BLADE_HIT_R2 = BLADE_HIT_R * BLADE_HIT_R;
  // P2 规格 2.2：命中窗口 0.9s，窗口内最多命中 3 个目标
  let bladeWindow = 0;
  let bladeHitsLeft = 0;

  function updateBlades(dt) {
    if (!skills.blade.owned) return;
    bladeAngle += BLADE_OMEGA * dt;
    if (bladeAngle >= Math.PI * 2) bladeAngle -= Math.PI * 2;
    for (let b = 0; b < BLADE_COUNT; b++) {
      const a = bladeAngle + b * Math.PI; // 两枚相隔 π
      bladeRot[b] = a;
      bladeX[b] = player.x + Math.cos(a) * BLADE_RADIUS;
      bladeY[b] = player.y + Math.sin(a) * BLADE_RADIUS;
    }
    // 命中窗口：到期重置配额，保证"最多 3 目标 / 0.9s"
    bladeWindow -= dt;
    if (bladeWindow <= 0) {
      bladeWindow = BLADE_CD;
      bladeHitsLeft = BLADE_MAX_TARGETS;
    }
    // 近战命中：每只敌人独立 bladeCd，保证单次掠过只掉一次血
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive || e.retreating || e.bladeCd > 0) continue;
      if (bladeHitsLeft <= 0) break; // 本窗口配额耗尽，等下一个窗口
      for (let b = 0; b < BLADE_COUNT; b++) {
        const dx = e.x - bladeX[b], dy = e.y - bladeY[b];
        const hr = e.er + BLADE_R; // 按怪体型算命中半径
        if (dx * dx + dy * dy <= hr * hr) {
          e.bladeCd = BLADE_CD;
          hitEnemy(e, bladeDmg(), false);
          spawnSparks(e.x, e.y);
          bladeHitsLeft--;
          break;
        }
      }
    }
  }

  function drawBlades() {
    if (!skills.blade.owned) return;
    for (let b = 0; b < BLADE_COUNT; b++) {
      ctx.save();
      ctx.translate(bladeX[b], bladeY[b]);
      // 刃口沿切线方向：视觉上像被甩起来的离心刀
      ctx.rotate(bladeRot[b] + Math.PI / 2);
      ctx.drawImage(bladeSprite, -BLADE_L / 2, -BLADE_HGT / 2, BLADE_L, BLADE_HGT);
      ctx.restore();
    }
  }

  // ===== 培养电弧（弹射）=====
  const ARC_MAX_POINTS = 1 + ARC_SEGMENTS * 2; // 玩家 + 3 段 × (抖动点 + 终点)
  const arcs = [];
  for (let i = 0; i < ARC_POOL; i++) {
    arcs.push({
      life: 0,
      count: 0,
      px: new Float32Array(ARC_MAX_POINTS),
      py: new Float32Array(ARC_MAX_POINTS)
    });
  }
  let arcCursor = 0;
  let arcCd = ARC_CD;
  const arcHit = [null, null, null, null];               // 本次已命中（去重）
  const arcNodeX = new Float32Array(ARC_SEGMENTS + 1);   // 折线节点（释放时算好）
  const arcNodeY = new Float32Array(ARC_SEGMENTS + 1);

  function fireArc(first) {
    const a = arcs[arcCursor];
    arcCursor = (arcCursor + 1) % ARC_POOL;

    let hitCount = 0;
    arcHit[hitCount++] = first;
    let nodeCount = 0;
    arcNodeX[0] = player.x; arcNodeY[0] = player.y; nodeCount = 1;

    let dmg = arcDmg();
    let fromX = first.x, fromY = first.y;
    arcNodeX[nodeCount] = fromX; arcNodeY[nodeCount] = fromY; nodeCount++;
    hitEnemy(first, dmg, false);
    dmg *= ARC_FALLOFF;
    spawnSparks(fromX, fromY);

    // 弹射 2 次：每次从上一个命中点找 120 内最近的未命中敌人
    for (let j = 0; j < ARC_JUMPS; j++) {
      const next = nearestEnemy(fromX, fromY, ARC_CHAIN_RANGE, arcHit, hitCount);
      if (!next) break;
      arcHit[hitCount++] = next;
      const nx = next.x, ny = next.y;
      hitEnemy(next, dmg, false);
      dmg *= ARC_FALLOFF;
      spawnSparks(nx, ny);
      fromX = nx; fromY = ny;
      arcNodeX[nodeCount] = nx; arcNodeY[nodeCount] = ny; nodeCount++;
    }

    // 锯齿折线：每段 midpoint 抖动，位置一次性算好，之后每帧只递减 life
    a.px[0] = arcNodeX[0]; a.py[0] = arcNodeY[0];
    let p = 1;
    for (let s = 0; s + 1 < nodeCount; s++) {
      const x0 = arcNodeX[s], y0 = arcNodeY[s];
      const x1 = arcNodeX[s + 1], y1 = arcNodeY[s + 1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.hypot(dx, dy) || 1;
      const j = (Math.random() - 0.5) * len * ARC_JITTER;
      a.px[p] = (x0 + x1) * 0.5 + (-dy / len) * j;
      a.py[p] = (y0 + y1) * 0.5 + (dx / len) * j;
      p++;
      a.px[p] = x1; a.py[p] = y1;
      p++;
    }
    a.count = p;
    a.life = ARC_LIFE;
  }

  function updateArcs(dt) {
    if (!skills.arc.owned) return;
    arcCd -= dt;
    if (arcCd <= 0) {
      const target = nearestEnemy(player.x, player.y, ARC_RANGE, null, 0);
      if (target) { fireArc(target); arcCd = ARC_CD; }
      else arcCd = ARC_RETRY;
    }
    for (let i = 0; i < ARC_POOL; i++) {
      const arc = arcs[i];
      if (arc.life > 0) arc.life -= dt;
    }
  }

  function strokeArcPath(a) {
    ctx.beginPath();
    ctx.moveTo(a.px[0], a.py[0]);
    for (let i = 1; i < a.count; i++) ctx.lineTo(a.px[i], a.py[i]);
    ctx.stroke();
  }

  function drawArcs() {
    if (!skills.arc.owned) return;
    for (let i = 0; i < ARC_POOL; i++) {
      const a = arcs[i];
      if (a.life <= 0) continue;
      const k = a.life / ARC_LIFE; // 1 → 0
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      // 宽的低透明紫色光晕（美术 issue：弧=霓虹紫）
      ctx.globalAlpha = 0.3 * k;
      ctx.strokeStyle = SKILL_META.arc.color;
      ctx.lineWidth = 7;
      strokeArcPath(a);
      // 细的高亮白线
      ctx.globalAlpha = Math.min(1, 1.1 * k);
      ctx.strokeStyle = COLOR_WHITE;
      ctx.lineWidth = 2;
      strokeArcPath(a);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  // 构筑系统（Prototype 2）
  // 经验/升级 → 三选一 → 分支进化。核心约束：每次发牌必须覆盖
  // 三类决策——①强化当前构筑 ②补弱点 ③改变路线。
  // ============================================================

  // ===== 伤害按等级取值 =====
  // P2 规格 2.2：每件武器按等级查表（不再用统一 +25%/级），再乘专精与战术调频增益
  function lvIdx(lv, len) { return Math.max(0, Math.min(len - 1, lv - 1)); }

  // 战术调频增益：脉冲超载（武器伤害 +30%）
  function buffDmg() { return buffs.overload > 0 ? 1 + 0.30 : 1; }
  // 战术调频增益：采样冲刺（移速 +25%）
  function buffHaste() { return buffs.haste > 0 ? 1 + 0.25 : 1; }
  // 战术调频增益：代谢抑制（受击伤害 -35%）
  function buffGuard() { return buffs.guard > 0 ? 1 - 0.35 : 1; }

  function needleDmg() { return NEEDLE_DMG_TABLE[lvIdx(skills.needle.lv, NEEDLE_DMG_TABLE.length)] * (1 + skillBonus.needle) * (1 + allDmgBonus) * buffDmg(); }
  function bladeDmg() { return BLADE_DMG_TABLE[lvIdx(skills.blade.lv, BLADE_DMG_TABLE.length)] * (1 + skillBonus.blade) * (1 + allDmgBonus) * buffDmg(); }
  function arcDmg() { return ARC_DMG_TABLE[lvIdx(skills.arc.lv, ARC_DMG_TABLE.length)] * (1 + skillBonus.arc) * (1 + allDmgBonus) * buffDmg(); }

  // ===== 经验与升级 =====
  function gainXp(n) {
    playerXp += n * xpMult;
    while (playerXp >= xpNext) {
      playerXp -= xpNext;
      playerLevel++;
      xpNext = playerLevel * XP_STEP;
      pendingLevels++;
    }
  }

  function openLevelUp() {
    uiOpen = true;
    branchMode = false;
    clearStick(); // 摇杆清零：否则松开事件晚到会让角色在选卡期间继续走
    dealCards();
  }

  // ===== SAMPLE（绿色样本点）=====
  const samples_pool = [];
  for (let i = 0; i < SAMPLE_POOL; i++) samples_pool.push({ active: false, x: 0, y: 0 });

  function dropSample(x, y) {
    for (let i = 0; i < SAMPLE_POOL; i++) {
      const s = samples_pool[i];
      if (!s.active) { s.active = true; s.x = x; s.y = y; return; }
    }
    // 池满直接丢弃，绝不扩容
  }

  const SAMPLE_PICK_R2 = SAMPLE_PICK_R * SAMPLE_PICK_R;
  function updateSamples() {
    for (let i = 0; i < SAMPLE_POOL; i++) {
      const s = samples_pool[i];
      if (!s.active) continue;
      const dx = s.x - player.x, dy = s.y - player.y;
      if (dx * dx + dy * dy <= SAMPLE_PICK_R2) {
        s.active = false;
        samples++;
        runSamples++;               // 结算面板"累计采样"统计（与可消耗余额分开记）
        // 复用火花池做一小簇绿色反馈
        for (let k = 0; k < 3; k++) {
          const a = Math.random() * Math.PI * 2;
          spawnParticle(
            s.x, s.y,
            Math.cos(a) * 50, Math.sin(a) * 50,
            0.18, 2.5,
            PARTICLE_SPRITES[P_GREEN]
          );
        }
      }
    }
  }

  function drawSamples() {
    ctx.save();
    ctx.fillStyle = COLOR_SAMPLE;
    for (let i = 0; i < SAMPLE_POOL; i++) {
      const s = samples_pool[i];
      if (!s.active) continue;
      ctx.beginPath();
      ctx.arc(s.x, s.y, SAMPLE_R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ===== 发牌：每次恰好 3 张（类别齐全）=====
  // 卡片：{ kind, cat, title, desc, sig }
  // P2 规格 2.5 卡池生成器五步：
  //   ① 读玩家状态 ② 读下一波配置 ③ 三类各生成候选 ④ 过滤无效 ⑤ 耗尽时用可重复强化兜底
  let cards = [];
  let cardRects = []; // {x,y,w,h,card}，供点击命中判定

  // 等级 → 伤害表的映射（卡面文案用真实数值，不写"+25%"这种含糊描述）
  const DMG_TABLES = { needle: NEEDLE_DMG_TABLE, blade: BLADE_DMG_TABLE, arc: ARC_DMG_TABLE };

  // 第 1 步：读玩家状态（等级 / 血量 / 槽位 / 武器等级 / 分支 / 专精次数）
  function readPlayerState() {
    const owned = [], organsOwned = [];
    for (let i = 0; i < SKILL_ORDER.length; i++) {
      if (skills[SKILL_ORDER[i]].owned) owned.push(SKILL_ORDER[i]);
    }
    for (let i = 0; i < ORGAN_ORDER.length; i++) {
      if (organs[ORGAN_ORDER[i]].owned) organsOwned.push(ORGAN_ORDER[i]);
    }
    const used = slotsUsed();
    return {
      level: playerLevel, hp: player.hp, maxHp: player.maxHp,
      slots: used, canInstall: used < MAX_SLOTS,
      owned: owned, locked: lockedSkills(), organs: organsOwned,
      branch: skills.needle.branch, samples: samples
    };
  }

  function upgradeableSkills() {
    const list = [];
    for (let i = 0; i < SKILL_ORDER.length; i++) {
      const k = SKILL_ORDER[i];
      const s = skills[k];
      if (s.owned && s.lv < SKILL_LV_CAP) list.push(k);
    }
    return list;
  }

  // 槽位统计：武器与生存器官都占 1 槽（P2 规格 2.1 的四槽竞争）
  function slotsUsed() {
    let n = 0;
    for (let i = 0; i < SLOT_ORDER.length; i++) {
      const k = SLOT_ORDER[i];
      if (k === 'regen' || k === 'cilia') { if (organs[k].owned) n++; }
      else if (skills[k].owned) n++;
    }
    return n;
  }

  function lockedSkills() {
    const list = [];
    for (let i = 0; i < SKILL_ORDER.length; i++) {
      if (!skills[SKILL_ORDER[i]].owned) list.push(SKILL_ORDER[i]);
    }
    return list;
  }

  // 武器升级卡：卡面写明真实伤害数值变化
  function upgradeCard(k) {
    const T = DMG_TABLES[k];
    const from = T[lvIdx(skills[k].lv, T.length)];
    const to = T[lvIdx(skills[k].lv + 1, T.length)];
    return {
      kind: 'upgrade', cat: '强化当前构筑', skill: k,
      sig: 'upgrade|' + k,
      title: SKILL_META[k].name + ' Lv' + skills[k].lv + '→Lv' + (skills[k].lv + 1),
      desc: '伤害 ' + from + '→' + to + '（间隔不变）'
    };
  }

  // 专精卡（可重复）：数值衰减 +35% → +8%，单武器累计封顶 +60%
  function specializeCard(k) {
    if (skillBonus[k] >= SPEC_CAP - 0.001) return null; // 已达上限：移除该候选（步骤④）
    const add = Math.max(SPEC_FLOOR, SPEC_FIRST * Math.pow(SPEC_FALLOFF, specCount[k]));
    return {
      kind: 'specialize', cat: '强化当前构筑', skill: k,
      sig: 'specialize|' + k,
      title: SKILL_META[k].name + ' 专精 Lv' + specCount[k] + '→Lv' + (specCount[k] + 1),
      desc: '伤害 +' + Math.round(add * 100) + '%（累计 +' + Math.round((skillBonus[k] + add) * 100) + '%）'
    };
  }

  // 生存器官卡（占 1 槽，卡面必须标明占位；同一机能只允许一个实例）
  function organCard(key) {
    const o = organs[key], M = ORGAN_META[key];
    if (!o.owned) {
      const d = key === 'regen' ? '生命上限 +' + REGEN_TABLE[0].maxHp + '，立即回复 ' + REGEN_TABLE[0].heal
                                 : '移速 +' + Math.round(CILIA_TABLE[0] * 100) + '%';
      return {
        kind: 'organ', cat: '补弱点', organ: key,
        sig: 'organ|' + key,
        title: '新器官：' + M.name, desc: d + ' · 占 1 槽'
      };
    }
    if (o.lv >= ORGAN_LV_CAP) return null;
    if (key === 'regen') {
      return {
        kind: 'organ', cat: '补弱点', organ: key, sig: 'organ|' + key,
        title: M.name + ' Lv1→Lv2',
        desc: '生命上限 +' + REGEN_TABLE[1].maxHp + '，立即回复 ' + REGEN_TABLE[1].heal
      };
    }
    return {
      kind: 'organ', cat: '补弱点', organ: key, sig: 'organ|' + key,
      title: M.name + ' Lv1→Lv2',
      desc: '移速再 +' + Math.round(CILIA_TABLE[1] * 100) + '%'
    };
  }

  // 武器安装卡（占 1 槽）：新武器或已解锁但没装的都走这里
  function installCard(k) {
    return {
      kind: 'newskill', cat: '改变路线', skill: k,
      sig: 'newskill|' + k,
      title: (skills[k].owned ? '装配：' : '新技能：') + SKILL_META[k].name,
      desc: '占 1 槽 · ' + (k === 'blade' ? '环绕近战，0.9s 最多切 3 个目标'
                                       : k === 'arc' ? '弹射连锁，0.8s 最多打 3 个目标'
                                       : '单体持续输出，0.8s 一发')
    };
  }

  // 分支进化入口卡（Lv3 起、耗样本、二选一不可逆）
  function branchCard() {
    if (skills.needle.branch) return null;
    if (skills.needle.lv < BRANCH_MIN_LV) return null;
    if (samples < BRANCH_SAMPLE_COST) return null;
    return {
      kind: 'branch', cat: '改变路线', sig: 'branch',
      title: '分支进化', desc: '耗 ' + BRANCH_SAMPLE_COST + ' 样本，不可逆二选一'
    };
  }

  // 战术调频卡（限时增益，不占槽）：同一时间不重复给同一个增益
  function tacticCard(t) {
    if (buffs[t.key] > 0) return null;
    return {
      kind: 'tactic', cat: '改变路线', tactic: t.key,
      sig: 'tactic|' + t.key,
      title: '战术调频：' + t.name, desc: t.desc + ' · 不占槽'
    };
  }

  function maxhpCard() {
    return { kind: 'maxhp', cat: '补弱点', sig: 'maxhp', title: '培养皿扩容', desc: '生命上限 +' + HP_CARD_GAIN + '（并回复' + HP_CARD_GAIN + '）' };
  }

  function speedCard() {
    return { kind: 'speed', cat: '补弱点', sig: 'speed', title: '鞭毛强化', desc: '移速 +15% · 不占槽' };
  }

  // 可重复兜底卡：强化类槽位枯竭时补位，类别始终是「强化当前构筑」
  function overclockCard() { return { kind: "overclock", cat: "强化当前构筑", sig: "overclock", title: "过载超频", desc: "全武器伤害 +8% · 可重复" }; }

  // 可重复兜底卡：路线类槽位枯竭时补位，类别始终是「改变路线」
  function tacticResetCard() { return { kind: "tacticreset", cat: "改变路线", sig: "tacticreset", title: "战术重整", desc: "回复 15 点生命，本次战斗经验 +10% · 可重复 · 不占槽" }; }

  function tacticPool() {
    const out = [];
    for (let i = 0; i < TACTIC_DEFS.length; i++) {
      const c = tacticCard(TACTIC_DEFS[i]);
      if (c) out.push(c);
    }
    return out;
  }

  // 专精候选池（可重复强化：强化类与兜底类共用）
  function specializePool(st) {
    const out = [];
    for (let i = 0; i < st.owned.length; i++) {
      const c = specializeCard(st.owned[i]);
      if (c) out.push(c);
    }
    return out;
  }

  // 强化候选：武器升级 + 可重复专精；只属于「强化当前构筑」一类
  function strengthenPool(st) {
    const out = [];
    const ups = upgradeableSkills();
    for (let i = 0; i < ups.length; i++) out.push(upgradeCard(ups[i]));
    for (let i = 0; i < st.owned.length; i++) {
      const c = specializeCard(st.owned[i]);
      if (c) out.push(c);
    }
    return out;
  }

  // 路线候选：分支进化 > 安装未解锁武器 > 战术调频；只属于「改变路线」一类
  function routePool(st) {
    const out = [];
    const b = branchCard();
    if (b) out.push(b);
    for (let i = 0; i < st.locked.length; i++) {
      if (st.canInstall) out.push(installCard(st.locked[i]));
    }
    const t = tacticPool();
    for (let i = 0; i < t.length; i++) out.push(t[i]);
    return out;
  }

  // 生存候选（Lv9 前）：生存器官优先——安装占 1 槽，已装的升级不增占位；都不行才用扩容/移速兜底
  function survivalPool(st) {
    const out = [];
    for (let i = 0; i < ORGAN_ORDER.length; i++) {
      const key = ORGAN_ORDER[i];
      const o = organs[key];
      if (o.owned && o.lv < ORGAN_LV_CAP) out.push(organCard(key));   // 升级：不增占位
      else if (!o.owned && st.canInstall) out.push(organCard(key));    // 安装：占 1 槽
    }
    if (out.length === 0) { out.push(maxhpCard()); out.push(speedCard()); }
    return out;
  }

  function pickOne(list) {
    if (!list || list.length === 0) return null;
    return list[(Math.random() * list.length) | 0];
  }

  // 类别守门取牌：池子为空时走 fb() 生成同类别兜底卡，保证槽位永不跨类别
  function safePick(pool, fb) {
    if (!pool || pool.length === 0) return fb();
    return pool[(Math.random() * pool.length) | 0];
  }

  function dealCards() {
    branchMode = false;
    cards = [];

    // ① 读玩家状态
    const st = readPlayerState();
    // ② 读下一波配置（同一时钟的真实调度数据）。
    //    按规格 2.3"只给信息、不推荐最优解"，这份画像只用于预告展示，不参与卡池权重。
    const threat = nextWaveInfo();

    // ③ 三槽位固定顺序：强化当前构筑 / 补弱点 / 改变路线。
    //    每槽位独立取牌，池子枯竭时降级到同类别兜底卡（绝不跨类别补位）。
    const slot0 = safePick(strengthenPool(st), function() {
      const sp = specializePool(st);
      return sp.length > 0 ? sp[(Math.random() * sp.length) | 0] : overclockCard();
    });
    const slot1 = safePick(survivalPool(st), function() { return maxhpCard(); });
    const slot2 = safePick(routePool(st), function() {
      const t = tacticPool();
      return t.length > 0 ? t[(Math.random() * t.length) | 0] : tacticResetCard();
    });

    const out = [slot0, slot1, slot2];

    // ④ 类别断言：三张卡必须分属三个不同类别（只报警不中断，避免把 UI 卡死）
    if (new Set(out.map(function(c) { return c.cat; })).size !== 3) {
      console.error("[CategoryGate] 发牌类别重复:", out.map(function(c) { return c.cat + ":" + c.sig; }).join(", "));
    }

    cards = out;
    previewInfo = threat; // 供升级界面顶部预告卡渲染
    layoutCards();
  }

  // 本次发牌时的下一波预告（升级界面顶部预告卡用）
  let previewInfo = null;

  function dealBranchCards() {
    branchMode = true;
    cards = [
      {
        kind: 'branchpick', cat: '分支进化', branch: 'through', sig: 'branchpick|through',
        title: '贯通针',
        desc: '穿透 +2 名敌人，首目标 -10% 伤害（打密集直线群）'
      },
      {
        kind: 'branchpick', cat: '分支进化', branch: 'pierce', sig: 'branchpick|pierce',
        title: '破甲针',
        desc: '无视重甲减免，对重甲 +15% 伤害（打精英/重甲）'
      },
      { kind: 'back', cat: '返回', sig: 'back', title: '再想想', desc: '保留三选一，不消耗样本' }
    ];
    layoutCards();
  }

  // 卡片纵向排列：逻辑坐标。顶部 150-230 留给"下一波威胁预告"卡
  const CARDS_TOP = 236;
  function layoutCards() {
    const totalH = cards.length * CARD_H + (cards.length - 1) * CARD_GAP;
    const startY = CARDS_TOP + Math.max(0, (LOGICAL_H - CARDS_TOP - 12 - totalH) / 2);
    cardRects.length = 0;
    for (let i = 0; i < cards.length; i++) {
      cardRects.push({
        x: (LOGICAL_W - CARD_W) / 2,
        y: startY + i * (CARD_H + CARD_GAP),
        w: CARD_W,
        h: CARD_H,
        card: cards[i]
      });
    }
  }

  function applyCard(card) {
    switch (card.kind) {
      case 'upgrade': {
        const s = skills[card.skill];
        if (s && s.lv < SKILL_LV_CAP) s.lv++;
        break;
      }
      case 'specialize': {
        // 专精：可重复获取，数值按次数衰减 +35% → +8%
        const k = card.skill;
        if (!k) break;
        const add = Math.min(Math.max(SPEC_FLOOR, SPEC_FIRST * Math.pow(SPEC_FALLOFF, specCount[k])),
                             SPEC_CAP - skillBonus[k]);
        skillBonus[k] += add;
        specCount[k]++;
        break;
      }
      case 'organ': {
        // 生存器官：Lv1 即时兑现（回血/移速），占 1 槽；同一机能只允许一个实例
        const o = organs[card.organ];
        if (!o) break;
        if (!o.owned) { o.owned = true; o.lv = 1; }
        else if (o.lv < ORGAN_LV_CAP) o.lv++;
        else break;
        if (card.organ === 'regen') {
          const d = REGEN_TABLE[o.lv - 1];
          player.maxHp += d.maxHp;
          player.hp = Math.min(player.maxHp, player.hp + d.heal); // 立刻回血：解决"现在可能死"
        } else {
          speedMult *= 1 + CILIA_TABLE[o.lv - 1]; // 移速累乘：Lv1 +15%、Lv2 再 +8%
        }
        break;
      }
      case 'tactic': {
        // 战术调频：限时增益，不占槽
        for (let i = 0; i < TACTIC_DEFS.length; i++) {
          if (TACTIC_DEFS[i].key === card.tactic) buffs[card.tactic] = TACTIC_DEFS[i].dur;
        }
        break;
      }
      case 'maxhp':
        player.maxHp += HP_CARD_GAIN;
        player.hp = Math.min(player.maxHp, player.hp + HP_CARD_GAIN);
        break;
      case 'speed':
        speedMult *= SPEED_CARD_MULT;
        break;
      case 'overclock':
        // 过载超频：可重复，全武器伤害线性累加
        allDmgBonus += 0.08;
        break;
      case 'tacticreset':
        // 战术重整：可重复，先回血再叠经验乘区（不占槽）
        player.hp = Math.min(player.maxHp, player.hp + 15);
        xpMult *= 1.10;
        break;
      case 'newskill': {
        // 槽满时不再允许安装新机能（只开放升级/进化）
        if (slotsUsed() >= MAX_SLOTS) break;
        const s = skills[card.skill];
        if (!s || s.owned) break;
        s.owned = true;
        s.lv = 1;
        pushToast('获得新技能：' + SKILL_META[card.skill].name);
        break;
      }
      case 'branchpick':
        // 不可逆：branch 只在为空时写入，重复选择无效（本局不可兼得）
        if (!skills.needle.branch && samples >= BRANCH_SAMPLE_COST) {
          samples -= BRANCH_SAMPLE_COST;
          skills.needle.branch = card.branch;
          pushToast('分支进化：' + card.title);
        }
        break;
      default:
        break;
    }
  }

  function handleUiTap(lx, ly) {
    for (let i = 0; i < cardRects.length; i++) {
      const r = cardRects[i];
      if (lx < r.x || lx > r.x + r.w || ly < r.y || ly > r.y + r.h) continue;
      const card = r.card;
      if (card.kind === 'branch') { dealBranchCards(); return; }
      if (card.kind === 'back') { dealCards(); return; }
      applyCard(card);
      pendingLevels--;
      if (pendingLevels > 0) dealCards(); // 连续升级：直接换牌，不关 UI
      else uiOpen = false;
      return;
    }
  }

  // ===== 三选一 UI 绘制（最上层）=====
  function drawWrapText(text, x, y, maxW, lh) {
    let line = '';
    let yy = y;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line.length > 0) {
        ctx.fillText(line, x, yy);
        line = ch;
        yy += lh;
      } else {
        line = test;
      }
    }
    if (line.length > 0) ctx.fillText(line, x, yy);
  }

  // ===== UI 样式规范（GPT-6 设计稿，2026-10-08）=====
  const UI_PANEL = 'rgba(37,17,63,0.88)';   // 面板深紫 #25113F @88%
  const UI_TEXT_DIM = '#D8CFFF';            // 次级文字

    '返回': '#8F7DAA',                      // 弱化灰
  };

  // ===== 下一波威胁预告卡（升级界面顶部，P2 规格 2.3）=====
  // 数据来自 WaveDirector 的真实调度（nextWaveInfo），只给信息、不推荐最优解
  function drawThreatPreviewCard() {
    if (branchMode || !previewInfo) return;
    const x = (LOGICAL_W - CARD_W) / 2, y = 146, h = 82;
    const info = previewInfo;
    const p = info.profile;

    ctx.fillStyle = 'rgba(20,32,48,0.92)';
    roundRect(x, y, CARD_W, h, 10);
    ctx.fill();
    ctx.strokeStyle = '#FF7A1A';
    ctx.lineWidth = 1.5;
    roundRect(x, y, CARD_W, h, 10);
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = UI_TEXT_MUT;
    ctx.font = 'bold 9px ui-monospace, monospace';
    ctx.fillText('下一波威胁预告', x + 12, y + 15);

    ctx.fillStyle = COLOR_WHITE;
    ctx.font = 'bold 14px ui-monospace, monospace';
    const label = info.label + (info.round > 0 ? '·第' + (info.round + 1) + '轮' : '') +
                  ' · ' + info.name + '（' + Math.ceil(info.remain) + '秒后）';
    ctx.fillText(label, x + 12, y + 36);

    ctx.fillStyle = ENEMY_KINDS[p.kind].color;
    ctx.font = 'bold 11px ui-monospace, monospace';
    ctx.fillText(ENEMY_KINDS[p.kind].name + '占比约' + p.ratio + '%', x + 12, y + 54);

    ctx.fillStyle = UI_TEXT_DIM;
    ctx.font = '10px ui-monospace, monospace';
    drawWrapText(p.tags.join(' · '), x + 12, y + 70, CARD_W - 24, 12);
  }

  function drawLevelUpUI() {
    if (!uiOpen) return;
    ctx.save();
    // 半透明遮罩
    ctx.fillStyle = UI_SCRIM_CARD;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // 标题
    ctx.fillStyle = COLOR_WHITE;
    ctx.font = 'bold 17px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(branchMode ? '分支进化 · 不可逆' : 'Lv.' + playerLevel + ' 升级！三选一', LOGICAL_W / 2, 126);

    drawThreatPreviewCard();

    for (let i = 0; i < cardRects.length; i++) {
      const r = cardRects[i];
      const card = r.card;
      const catColor = CAT_COLORS[card.cat] || COLOR_PLAYER;
      // 卡面：深紫面板 + 类别色发光描边
      ctx.fillStyle = UI_PANEL;
      roundRect(r.x, r.y, r.w, r.h, 12);
      ctx.fill();
      ctx.strokeStyle = catColor;
      ctx.lineWidth = 2;
      ctx.shadowColor = catColor;
      ctx.shadowBlur = 12;
      roundRect(r.x, r.y, r.w, r.h, 12);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 类别胶囊标签
      ctx.textAlign = 'left';
      ctx.font = 'bold 10px ui-monospace, monospace';
      const catW = ctx.measureText(card.cat).width + 14;
      ctx.fillStyle = catColor;
      roundRect(r.x + 14, r.y + 10, catW, 18, 9);
      ctx.fill();
      ctx.fillStyle = '#1A0B2E';
      ctx.fillText(card.cat, r.x + 21, r.y + 23);

      // 技能名（强化卡按技能色）
      ctx.font = 'bold 17px ui-monospace, monospace';
      const meta = (card.skill && SKILL_META[card.skill]) ? SKILL_META[card.skill]
                  : (card.organ ? ORGAN_META[card.organ] : null);
      ctx.fillStyle = meta ? meta.color : COLOR_WHITE;
      ctx.fillText(card.title, r.x + 14, r.y + 56);

      // 说明（长文本折行）
      ctx.font = '12px ui-monospace, monospace';
      ctx.fillStyle = UI_TEXT_DIM;
      drawWrapText(card.desc, r.x + 14, r.y + 78, r.w - 28, 15);
    }
    ctx.restore();
  }

// ============================================================

  const UI_SCRIM_CARD = 'rgba(9,3,18,0.72)';    // 战斗模态遮罩 72%

  function uiFont(size, weight) { ctx.font = weight + ' ' + size + 'px ' + UI_FONT; }

  // 单一真相：当前 UI 状态由既有标志位派生（uiOpen/branchMode/paused/dead），
  // 优先级 DEAD > EVOLUTION > LEVEL_UP > PAUSED > RUNNING，任一时刻只有一个主模态
  function currentUiState() {
    if (dead) return UIState.DEAD;

  }
  // 冻结条件：升级/进化/暂停/死亡一律冻结 elapsed 与全部战斗逻辑
  function isBattleFrozen() { return currentUiState() !== UIState.RUNNING; }

  function hitRect(r, x, y) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  // ===== 战斗提示条（Toast 队列）=====
  function pushToast(text) {
    if (toastQueue.length >= TOAST_QUEUE_MAX) toastQueue.shift();
    toastQueue.push(text);
  }
  // 模态/冻结期间既不显示新的提示，也不消耗已有提示的显示时间
  function updateToasts(dt) {
    if (isBattleFrozen()) return;
    if (!toast) {
      if (toastQueue.length === 0) return;
      toast = { text: toastQueue.shift(), t: 0 };
    }
    toast.t += dt;
    if (toast.t >= TOAST_LIFE) { toast = null; }
  }
  function drawToasts() {
    if (!toast || isBattleFrozen()) return;
    let a = 1;
    if (toast.t < TOAST_FADE_IN) a = toast.t / TOAST_FADE_IN;
    else if (toast.t > TOAST_LIFE - TOAST_FADE_OUT) a = (TOAST_LIFE - toast.t) / TOAST_FADE_OUT;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.fillStyle = 'rgba(37,17,63,0.92)';
    roundRect(TOAST.x, TOAST.y, TOAST.w, TOAST.h, TOAST.r);
    ctx.fill();
    ctx.strokeStyle = UI_PURPLE;
    ctx.lineWidth = 1;
    ctx.shadowColor = 'rgba(180,91,224,0.35)';
    ctx.shadowBlur = 3;
    roundRect(TOAST.x, TOAST.y, TOAST.w, TOAST.h, TOAST.r);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLOR_WHITE;
    uiFont(12, '700');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(toast.text, TOAST.x + TOAST.w / 2, TOAST.y + TOAST.h / 2 + 0.5);
    ctx.restore();
  }

  // ===== 通用按钮绘制（规范：填充 + 描边 + 主题色发光）=====
  function drawButton(r, label, strokeColor, glowBlur) {
    ctx.fillStyle = UI_BG_BTN;
    roundRect(r.x, r.y, r.w, r.h, r.r);
    ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = strokeColor;
    ctx.shadowBlur = glowBlur;
    roundRect(r.x, r.y, r.w, r.h, r.r);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLOR_WHITE;
    uiFont(15, '700'); // 规范 46px ÷3
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 0.5);
  }

  // ===== HUD 暂停按钮（规范 §3）=====
  function drawPauseButton() {
    const b = PAUSE_BTN;
    ctx.save();
    ctx.fillStyle = UI_PANEL;
    roundRect(b.x, b.y, b.w, b.h, b.r);
    ctx.fill();
    ctx.strokeStyle = UI_PURPLE;
    ctx.lineWidth = 1;
    ctx.shadowColor = 'rgba(180,91,224,0.45)';
    ctx.shadowBlur = 4;
    roundRect(b.x, b.y, b.w, b.h, b.r);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 按下态亮度 +12%
    if (pausePressT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      roundRect(b.x, b.y, b.w, b.h, b.r);
      ctx.fill();
    }
    // 白色双竖条图标：规范 26×32 ÷3 ≈ 8.7×10.7 居中
    const iw = 8.7, ih = 10.7, barW = 2.4, gap = iw - barW * 2;
    const ix = b.x + (b.w - iw) / 2, iy = b.y + (b.h - ih) / 2;

    ctx.fillRect(ix, iy, barW, ih);

  }

  // ===== 死亡结算面板（规范 §8）=====
  function fmtRunTime(sec) {
    const s = Math.max(0, sec);
    if (s < 60) return s.toFixed(1) + '秒';
    const m = Math.floor(s / 60);
    return m + '分' + Math.floor(s - m * 60) + '秒';
  }
  function deathStatValues() {
    return [
      fmtRunTime(elapsed),               // 存活时间（elapsed 本就在冻结时不推进）
      String(killCount),                 // 击杀
      'Lv.' + playerLevel,               // 等级
      String(runSamples)                 // 累计采样
    ];
  }
  function drawDeathUI() {
    if (currentUiState() !== UIState.DEAD) return;
    ctx.save();
    ctx.fillStyle = UI_SCRIM_PAUSE;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    const p = DEATH_PANEL;
    ctx.fillStyle = UI_BG_DEEP;
    roundRect(p.x, p.y, p.w, p.h, p.r);
    ctx.fill();
    ctx.strokeStyle = UI_RED;
    ctx.lineWidth = 1.6;
    ctx.shadowColor = 'rgba(255,77,109,0.55)';
    ctx.shadowBlur = 10;
    roundRect(p.x, p.y, p.w, p.h, p.r);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = UI_RED;

    ctx.fillText('本次实验已终止', p.x + p.w / 2, p.y + 76);

    const titles = ['存活时间', '击杀', '等级', '累计采样'];
    const vals = deathStatValues();

      roundRect(r.x, r.y, DEATH_STAT_W, DEATH_STAT_H, 5);
      ctx.stroke();

      ctx.fillText(titles[i], r.x + DEATH_STAT_W / 2, r.y + 13);

  // ===== 模态点击分发（返回 true = 已消费本次点击，不再当摇杆按下）=====
  function handleModalTap(lx, ly) {
    const st = currentUiState();
    if (st === UIState.DEAD) {
      if (hitRect(BTN_RETRY, lx, ly)) resetRun();
      return true;
    }
    if (st === UIState.PAUSED) {
      if (confirmRestart) {
        if (hitRect(BTN_CONFIRM_YES, lx, ly)) { confirmRestart = false; resetRun(); }
        else if (hitRect(BTN_CONFIRM_NO, lx, ly)) confirmRestart = false;
      } else {
        if (hitRect(BTN_CONTINUE, lx, ly)) { paused = false; clearStick(); }
        else if (hitRect(BTN_RESTART, lx, ly)) confirmRestart = true;
      }
      return true;
    }
    if (st === UIState.LEVEL_UP || st === UIState.EVOLUTION) {
      handleUiTap(lx, ly);
      return true;
    }
    return false;
  }

  function clearStick() {
    stick.x = 0;
    stick.y = 0;
    stick.active = false;
    stick.pointerId = null;
  }

  function openPause() {
    paused = true;
    confirmRestart = false;
    clearStick();
  }

  // ===== 重开：回滚本局全部状态 =====
  function resetRun() {
    player.x = LOGICAL_W / 2;
    player.y = LOGICAL_H - 140;
    player.hp = BASE_HP;
    player.maxHp = BASE_HP;
    player.invuln = 0;
    player.animTime = 0;
    player.hurtFlash = 0;
    skills.needle.owned = true; skills.needle.lv = 1; skills.needle.branch = null;
    skills.blade.owned = false; skills.blade.lv = 0; skills.blade.branch = null;
    skills.arc.owned = false; skills.arc.lv = 0; skills.arc.branch = null;
    // P2 生存器官（各占 1 槽）：重开必须清空，否则槽位与增益会跨局残留
    organs.regen.owned = false; organs.regen.lv = 0;
    organs.cilia.owned = false; organs.cilia.lv = 0;
    // P2 专精累计与战术调频倒计时：清零（否则下一局伤害/受击带着上一局的加成）
    for (const k in skillBonus) skillBonus[k] = 0;
    for (const k in specCount) specCount[k] = 0;
    for (const k in buffs) buffs[k] = 0;
    allDmgBonus = 0; xpMult = 1;
    playerLevel = 1; playerXp = 0; xpNext = XP_STEP; pendingLevels = 0;
    samples = 0; runSamples = 0; killCount = 0; elapsed = 0;
    speedMult = 1;
    // 波次调度：i 回 -1 哨兵值，下一帧 updateWaveDirector 会 beginWave 重建 W1
    waveNow.i = -1; waveNow.round = 0; waveNow.phase = 'preview';
    waveNow.cursor = 0; waveNow.lastSpawnAt = -99;
    waveNow.spawned = 0; waveNow.dropped = 0;
    needleCd = NEEDLE_CD; arcCd = ARC_CD; bladeAngle = 0;
    for (let i = 0; i < needles.length; i++) needles[i].active = false;
    for (let i = 0; i < arcs.length; i++) arcs[i].life = 0;
    for (let i = 0; i < particles.length; i++) particles[i].life = 0;
    for (let i = 0; i < dmgNums.length; i++) dmgNums[i].life = 0;
    for (let i = 0; i < samples_pool.length; i++) samples_pool[i].active = false;
    // P2：敌人由 WaveDirector 动态投放（不再是固定池），重开直接清空数组
    enemies.length = 0;
    uiOpen = false; branchMode = false;
    paused = false; dead = false; confirmRestart = false;
    toastQueue.length = 0; toast = null;
    hitStop = 0; shake = 0; pausePressT = 0;
    clearStick();
  }

  // ===== 槽位 UI（左上 3x2 网格，霓虹发光描边）=====
  // P2：候选机能 5 种（3 武器 + 2 生存器官），但只有 MAX_SLOTS=4 个槽位，
  // 已装的按 SLOT_ORDER 顺序靠前排，剩余格显示"空"（= 还能再装 1 个）。
  function drawSlots() {
    const x0 = 8, y0 = 44, gap = 5; // 下移，给顶部条让位
    const S = 30, COLS = 3, ROWS = 2;
    const CELLS = COLS * ROWS;
    // 已装机能列表（武器在前，器官在后）
    const filled = [];
    for (let i = 0; i < SLOT_ORDER.length; i++) {
      const k = SLOT_ORDER[i];
      const owned = (k === 'regen' || k === 'cilia') ? organs[k].owned : skills[k].owned;
      if (owned) filled.push(k);
    }
    ctx.save();
    ctx.textAlign = 'center';
    for (let i = 0; i < CELLS; i++) {
      const col = i % COLS, row = (i / COLS) | 0;
      const x = x0 + col * (S + gap), y = y0 + row * (S + gap);
      const key = filled[i];
      if (key) {
        const isOrgan = (key === 'regen' || key === 'cilia');
        const meta = isOrgan ? ORGAN_META[key] : SKILL_META[key];
        const st = isOrgan ? organs[key] : skills[key];
        const sc = meta.color;
        ctx.fillStyle = UI_PANEL;
        roundRect(x, y, S, S, 8);
        ctx.fill();
        ctx.strokeStyle = sc;
        ctx.lineWidth = 2;
        ctx.shadowColor = sc;
        ctx.shadowBlur = 9;
        roundRect(x, y, S, S, 8);
        ctx.stroke();
        ctx.shadowBlur = 0;
        // 技能图标（有图画图，无图画文字）
        const icon = isOrgan ? null : SKILL_ICONS[key];
        if (icon && icon.complete && icon.naturalWidth > 0) {
          const isz = 19;
          ctx.drawImage(icon, x + (S - isz) / 2, y + 2, isz, isz);
        } else {
          ctx.fillStyle = sc;
          ctx.font = 'bold 13px ui-monospace, monospace';
          ctx.fillText(meta.short, x + S / 2, y + 16);
        }
        ctx.fillStyle = COLOR_WHITE;
        ctx.font = 'bold 9px ui-monospace, monospace';
        ctx.fillText('Lv' + st.lv, x + S / 2, y + 27);
        if (!isOrgan && st.branch) {
          ctx.fillStyle = COLOR_SAMPLE;
          ctx.font = 'bold 9px ui-monospace, monospace';
          ctx.fillText('*', x + S - 5, y + 10);
        }
      } else {
        ctx.strokeStyle = 'rgba(143,125,170,0.35)';
        ctx.lineWidth = 1.2;
        roundRect(x, y, S, S, 8);
        ctx.stroke();
        ctx.fillStyle = 'rgba(143,125,170,0.4)';
        ctx.font = '9px ui-monospace, monospace';
        ctx.fillText('空', x + S / 2, y + 18);
      }
    }
    ctx.restore();
  }

  // ===== 下一波预告 HUD（底部胶囊：波名 + 倒计时，真实调度数据）=====
  function drawWavePreviewHud() {
    const info = nextWaveInfo();
    const label = '下一波 ' + info.label + ' ' + info.name + ' · ' + Math.ceil(info.remain) + 's';
    ctx.save();
