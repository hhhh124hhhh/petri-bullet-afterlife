<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>培养皿：弹幕余生 — Prototype 0（移动手感验证）</title>
<style>
  /* 页面深色背景，Canvas 居中铺满视口 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07121D;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    /* 让 canvas 保持 9:16 比例并尽可能铺满视口 */
    aspect-ratio: 9 / 16;
    height: 100vh;
    max-width: 100vw;
    image-rendering: auto;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<script>
(function () {
  'use strict';

  // ===== 逻辑分辨率（竖屏 9:16）=====
  const LOGICAL_W = 360;
  const LOGICAL_H = 640;

  // ===== 色板 =====
  const COLOR_BG = '#07121D';      // 背景深蓝黑
  const COLOR_PLAYER = '#38E8E0'; // 玩家青
  const COLOR_ENEMY = '#FF7138';   // 感染橙
  const COLOR_OUTLINE = '#241638';// 描边深紫
  const COLOR_WHITE = '#F3F7FA';   // 系统白

  // ===== 玩法参数 =====
  const PLAYER_SPEED = 150;   // 玩家移速 px/s（跟手性优先于纸面数值）
  const ENEMY_SPEED = 110;    // 敌人移速 px/s
  const ENEMY_COUNT = 20;     // 敌人数量
  const ENEMY_SIZE = 16;      // 敌人逻辑尺寸
  const ENEMY_SEPARATION = 26;// 敌人分离强度系数
  const INVOKED_IFRAME = 0.45; // 无敌帧时长（秒）

  // ===== 摇杆参数（视觉与响应统一半径，避免"手在动、杆不动"的脱节感）=====
  const STICK_RADIUS = 50; // 手指拖到 50px 即满速

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 自适应缩放：把逻辑坐标映射到实际画布尺寸 =====
  let scale = 1;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.max(1, Math.round(rect.width));
    const cssH = Math.max(1, Math.round(rect.height));

    // 后备缓冲按 devicePixelRatio 放大
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);

    // 逻辑 360x640 等比缩放铺满画布（contain），居中
    scale = Math.min(canvas.width / LOGICAL_W, canvas.height / LOGICAL_H);
    const offX = (canvas.width - LOGICAL_W * scale) / 2;
    const offY = (canvas.height - LOGICAL_H * scale) / 2;

    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.imageSmoothingEnabled = true;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    // 延迟一帧，等待布局稳定后再计算
    setTimeout(resize, 100);
  });

  // ===== 玩家状态 =====
  const player = {
    x: LOGICAL_W / 2,
    y: LOGICAL_H - 140,
    size: 24,
    invuln: 0,     // 剩余无敌时间
    animTime: 0     // 浮动动画计时
  };

  // ===== 敌人集合 =====
  const enemies = [];

  function spawnEnemy(i) {
    // 沿屏幕四周外圈生成，避免一开始就压在玩家身上
    const side = i % 4;
    let x, y;
    if (side === 0) { x = -20; y = Math.random() * LOGICAL_H; }
    else if (side === 1) { x = LOGICAL_W + 20; y = Math.random() * LOGICAL_H; }
    else if (side === 2) { x = Math.random() * LOGICAL_W; y = -20; }
    else { x = Math.random() * LOGICAL_W; y = LOGICAL_H + 20; }
    enemies.push({
      x: x,
      y: y,
      vx: 0,
      vy: 0,
      seed: Math.random() * Math.PI * 2,
      wobble: 0.6 + Math.random() * 0.8, // 每只细胞的蠕动相位频率
      orbitR: 30 + Math.random() * 16    // 包围半径：瞄准玩家周围而非玩家中心，避免堆叠成一团
    });
  }

  for (let i = 0; i < ENEMY_COUNT; i++) spawnEnemy(i);

  // ===== 摇杆状态 =====
  const stick = {
    active: false,
    pointerId: null,   // 只处理单点触控
    originX: 0,         // 按下点（摇杆中心）
    originY: 0,
    knobX: 0,           // 当前摇杆头位置
    knobY: 0,
    x: 0,               // 归一化方向 -1~1
    y: 0,
    returnT: 1          // 松手回中插值
  };

  // 把屏幕坐标转换为逻辑坐标
  function toLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const px = (clientX - rect.left) * (canvas.width / rect.width);
    const py = (clientY - rect.top) * (canvas.height / rect.height);
    return {
      x: (px - (canvas.width - LOGICAL_W * scale) / 2) / scale,
      y: (py - (canvas.height - LOGICAL_H * scale) / 2) / scale
    };
  }

  function stickDown(p) {
    // 已有激活指针则忽略（单点触控）
    if (stick.active) return;
    stick.active = true;
    stick.pointerId = p.id;
    stick.originX = p.x;
    stick.originY = p.y;
    stick.knobX = p.x;
    stick.knobY = p.y;
    stick.x = 0;
    stick.y = 0;
    stick.returnT = 0;
  }

  function stickMove(p) {
    if (!stick.active || p.id !== stick.pointerId) return;
    let dx = p.x - stick.originX;
    let dy = p.y - stick.originY;
    const len = Math.hypot(dx, dy);

    // 摇杆头 1:1 跟手（钳制在统一半径内）；力度按同一半径归一化
    const k = len > STICK_RADIUS ? STICK_RADIUS / len : 1;
    stick.knobX = stick.originX + dx * k;
    stick.knobY = stick.originY + dy * k;

    // 死区处理
    const DEAD = 4;
    if (len > DEAD) {
      const nx = dx / len;
      const ny = dy / len;
      // 响应曲线：小幅度推动也给足速度（pow<1 让前段更陡），拒绝"肉"
      const t = Math.min(1, (len - DEAD) / (STICK_RADIUS - DEAD));
      const strength = Math.pow(t, 0.7);
      stick.x = nx * strength;
      stick.y = ny * strength;
    } else {
      stick.x = 0;
      stick.y = 0;
    }
  }

  function stickUp(p) {
    if (!stick.active) return;
    if (p && p.id !== undefined && p.id !== stick.pointerId) return;
    stick.active = false;
    stick.pointerId = null;
    stick.x = 0;
    stick.y = 0;
    stick.returnT = 0;
  }

  // ===== 鼠标事件（桌面端拖拽）=====
  canvas.addEventListener('mousedown', function (e) {
    e.preventDefault();
    const p = toLogical(e.clientX, e.clientY);
    stickDown({ id: 'mouse', x: p.x, y: p.y });
  });
  window.addEventListener('mousemove', function (e) {
    if (!stick.active) return;
    const p = toLogical(e.clientX, e.clientY);
    stickMove({ id: 'mouse', x: p.x, y: p.y });
  });
  window.addEventListener('mouseup', function (e) {
    stickUp({ id: 'mouse' });
  });
  window.addEventListener('mouscancel', function (e) {
    stickUp({ id: 'mouse' });
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ===== 触摸事件（移动端）=====
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    // 只取第一个触点，保证单点操控
    const t = e.changedTouches[0];
    if (!t) return;
    const p = toLogical(t.clientX, t.clientY);
    stickDown({ id: t.identifier, x: p.x, y: p.y });
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === stick.pointerId) {
        const p = toLogical(t.clientX, t.clientY);
        stickMove({ id: t.identifier, x: p.x, y: p.y });
      }
    }
  }, { passive: false });

  function endTouch(e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === stick.pointerId) {
        stickUp({ id: t.identifier });
      }
    }
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  // ===== 程序绘制：玩家 PETRI-07 =====
  function drawPlayer(x, y, t, alpha) {
    const s = player.size;
    const half = s / 2;

    // 2~3 帧浮动动画：上下浮动 + 呼吸缩放
    const floatOffset = Math.sin(t * 3.2) * 2.2;
    const breathe = 1 + Math.sin(t * 3.2 + Math.PI / 2) * 0.045;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y + floatOffset);
    ctx.scale(breathe, breathe);
    ctx.translate(-x, -(y + floatOffset));

    // 地面投影（增强浮动感）
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = COLOR_OUTLINE;
    ctx.beginPath();
    ctx.ellipse(x, y + half + 3.5, half * 0.8, half * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha;

    const cx = x;
    const cy = y;

    // —— 深紫粗描边底（先画一圈放大的轮廓）——
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = 3.2;
    ctx.lineJoin = 'round';

    // 身体：圆角矩形主体
    roundRect(cx - half + 2.5, cy - half + 2.5, s - 5, s - 6, 5);
    ctx.stroke();

    // 天线
    ctx.beginPath();
    ctx.moveTo(cx, cy - half + 2.5);
    ctx.lineTo(cx, cy - half - 2.5);
    ctx.stroke();

    // 两侧小臂
    ctx.beginPath();
    ctx.moveTo(cx - half + 2.5, cy + 1);
    ctx.lineTo(cx - half - 1.5, cy + 1);
    ctx.moveTo(cx + half - 2.5, cy + 1);
    ctx.lineTo(cx + half + 1.5, cy + 1);
    ctx.stroke();

    // —— 白色主体 ——
    ctx.fillStyle = COLOR_WHITE;
    roundRect(cx - half + 2.5, cy - half + 2.5, s - 5, s - 6, 5);
    ctx.fill();

    // 头顶盖（略深一点的白，带描边）
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = 1.6;
    roundRect(cx - half + 5, cy - half + 5, s - 10, 5.5, 2);
    ctx.stroke();

    // 手臂
    ctx.beginPath();
    ctx.moveTo(cx - half + 2.5, cy + 1);
    ctx.lineTo(cx - half - 1.5, cy + 1);
    ctx.moveTo(cx + half - 2.5, cy + 1);
    ctx.lineTo(cx + half + 1.5, cy + 1);
    ctx.stroke();

    // 天线尖端（青色）
    ctx.fillStyle = COLOR_PLAYER;
    ctx.beginPath();
    ctx.arc(cx, cy - half - 3.2, 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // —— 青色核心灯 ——
    const pulse = 0.82 + Math.sin(t * 5.0) * 0.18;
    ctx.globalAlpha = alpha * pulse;
    ctx.fillStyle = COLOR_PLAYER;
    ctx.beginPath();
    ctx.arc(cx, cy + 1.5, 3.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = COLOR_OUTLINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx, cy + 1.5, 3.6, 0, Math.PI * 2);
    ctx.stroke();

    // 核心高光
    ctx.fillStyle = COLOR_WHITE;
    ctx.beginPath();
    ctx.arc(cx - 1.1, cy + 0.3, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // 圆角矩形路径（Canvas 兼容实现）
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  // ===== 程序绘制：感染细胞敌人 =====
  function drawEnemy(e, t) {
    const r = ENEMY_SIZE / 2;
    const wob = 1 + Math.sin(t * 4.5 * e.wobble + e.seed) * 0.09;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(wob, wob);
    ctx.translate(-e.x, -e.y);

    // 深紫描边：先画大一圈的轮廓
    ctx.fillStyle = COLOR_OUTLINE;
    blobPath(e.x, e.y, r + 2.2, e.seed, 1.0);
    ctx.fill();

    // 橙色主体
    ctx.fillStyle = COLOR_ENEMY;
    blobPath(e.x, e.y, r, e.seed, 0.0);
    ctx.fill();

    // 内部暗核 + 高光
    ctx.fillStyle = COLOR_OUTLINE;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(e.x - r * 0.18, e.y + r * 0.2, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = COLOR_WHITE;
    ctx.beginPath();
    ctx.arc(e.x - r * 0.34, e.y - r * 0.36, r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // 生成带扰动的圆形轮廓（让每个细胞形状略有差异）
  function blobPath(x, y, r, seed, inflate) {
    const lobes = 7;
    ctx.beginPath();
    for (let i = 0; i <= lobes; i++) {
      const a = (i / lobes) * Math.PI * 2;
      const wob = 1 + Math.sin(a * 3 + seed) * 0.12 + Math.cos(a * 2 - seed) * 0.07;
      const rr = r * wob + inflate;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // ===== 摇杆绘制 =====
  function drawStick(dt) {
    if (stick.active) {
      // 底座圆圈
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = COLOR_WHITE;
      ctx.beginPath();
      ctx.arc(stick.originX, stick.originY, STICK_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // 底座描边
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = COLOR_PLAYER;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(stick.originX, stick.originY, STICK_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // 摇杆头
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = COLOR_PLAYER;
      ctx.beginPath();
      ctx.arc(stick.knobX, stick.knobY, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COLOR_OUTLINE;
      ctx.lineWidth = 2;
      ctx.stroke();

      // 方向指示线
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = COLOR_PLAYER;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(stick.originX, stick.originY);
      ctx.lineTo(stick.knobX, stick.knobY);
      ctx.stroke();
      ctx.restore();
    } else {
      // 松手后摇杆头回中并淡出
      stick.returnT = Math.min(1, stick.returnT + dt * 5);
      const ease = 1 - stick.returnT;
      if (ease > 0.01) {
        // 回中：向摇杆中心 origin 插值，而不是向 (0,0)
        const kx = lerp(stick.knobX, stick.originX, ease * 0.35);
        const ky = lerp(stick.knobY, stick.originY, ease * 0.35);
        ctx.save();
        ctx.globalAlpha = 0.4 * ease;
        ctx.fillStyle = COLOR_PLAYER;
        ctx.beginPath();
        ctx.arc(kx, ky, 18 * ease + 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  // ===== 边界限制 =====
  function clampToBounds(o, halfW, halfH) {
    o.x = Math.max(halfW, Math.min(LOGICAL_W - halfW, o.x));
    o.y = Math.max(halfH, Math.min(LOGICAL_H - halfH, o.y));
  }

  // ===== 主循环 =====
  let lastTime = performance.now();
  let elapsed = 0;

  function frame(now) {
    // delta 时间（秒），上限 0.05s 防止切后台后大跳
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    elapsed += dt;
    lastDt = dt;

    update(dt);
    draw(elapsed);
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // —— 玩家移动（摇杆归一化方向 × 移速）——
    const moveLen = Math.hypot(stick.x, stick.y);
    if (moveLen > 0.001) {
      player.x += stick.x * PLAYER_SPEED * dt;
      player.y += stick.y * PLAYER_SPEED * dt;
    }
    clampToBounds(player, player.size / 2, player.size / 2);

    // 浮动动画计时 + 无敌帧计时
    player.animTime += dt;
    if (player.invuln > 0) player.invuln -= dt;

    // —— 敌人追踪：瞄准玩家周围的包围点（形成环绕，而非堆叠在玩家身上）——
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const tx = player.x + Math.cos(e.seed) * e.orbitR;
      const ty = player.y + Math.sin(e.seed) * e.orbitR;
      const dx = tx - e.x;
      const dy = ty - e.y;
      const d = Math.hypot(dx, dy) || 1;
      // 直接朝包围点移动
      e.vx = (dx / d) * ENEMY_SPEED;
      e.vy = (dy / d) * ENEMY_SPEED;

      // 与其他敌人的分离力，避免完全重叠（作用半径加大）
      for (let j = i + 1; j < enemies.length; j++) {
        const o = enemies[j];
        const ox = e.x - o.x;
        const oy = e.y - o.y;
        const od = Math.hypot(ox, oy);
        const minDist = 30;
        if (od > 0.0001 && od < minDist) {
          const push = (minDist - od) / minDist * ENEMY_SEPARATION;
          const px = (ox / od) * push;
          const py = (oy / od) * push;
          e.vx += px;
          e.vy += py;
          o.vx -= px;
          o.vy -= py;
        }
      }

      e.x += e.vx * dt;
      e.y += e.vy * dt;
    }

    // —— P0 只验证移动手感：关闭碰撞击退，避免敌人包围圈形成"人群阻力"。
    // 受击方向/伤害/无敌帧留给 Prototype 1（战斗爽感）再做。
  }

  function draw(t) {
    // 背景
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    // 背景培养皿网格纹理（轻微）
    drawDishBackground(t);

    // 敌人
    for (let i = 0; i < enemies.length; i++) {
      drawEnemy(enemies[i], t);
    }

    // 玩家（无敌帧闪烁）
    let alpha = 1;
    if (player.invuln > 0) {
      // 高频闪烁
      alpha = Math.sin(player.invuln * 60) > 0 ? 0.35 : 1;
    }
    drawPlayer(player.x, player.y, player.animTime, alpha);

    // 摇杆
    drawStick(dtForStick());
  }

  // drawStick 需要 dt 做回中插值，这里保存最近一帧的 dt
  let lastDt = 0;
  function dtForStick() { return lastDt; }

  // 培养皿背景：网格 + 缓慢光晕
  function drawDishBackground(t) {
    ctx.save();
    // 网格
    ctx.globalAlpha = 0.05;
    ctx.strokeStyle = COLOR_PLAYER;
    ctx.lineWidth = 1;
    const grid = 40;
    ctx.beginPath();
    for (let x = 0; x <= LOGICAL_W; x += grid) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, LOGICAL_H);
    }
    for (let y = 0; y <= LOGICAL_H; y += grid) {
      ctx.moveTo(0, y);
      ctx.lineTo(LOGICAL_W, y);
    }
    ctx.stroke();

    // 中心微弱光晕，随时间呼吸
    ctx.globalAlpha = 0.05 + Math.sin(t * 1.2) * 0.02;
    const grad = ctx.createRadialGradient(
      LOGICAL_W / 2, LOGICAL_H / 2, 20,
      LOGICAL_W / 2, LOGICAL_H / 2, LOGICAL_H * 0.7
    );
    grad.addColorStop(0, COLOR_PLAYER);
    grad.addColorStop(1, 'rgba(56,232,224,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.restore();
  }

  // ===== 启动 =====
  resize();
  requestAnimationFrame(function (now) {
    lastTime = now;
    frame(now);
  });
})();
</script>
</body>
</html>
